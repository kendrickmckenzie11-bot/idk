<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Singing Monsters Clone</title>
    <style>
        /* --- GENERAL STYLES --- */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrolling */
            background-color: #87CEEB; /* Sky blue */
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; /* Cartoonish font */
            user-select: none; /* Prevents text selection when clicking fast */
        }

        /* --- THE ISLAND (Background) --- */
        #island {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85vh; /* Leaves room for the UI bar */
            background: radial-gradient(circle at center bottom, #7CFC00 0%, #228B22 40%, #006400 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* A simple CSS tree to make it look like an island */
        .tree {
            position: absolute;
            bottom: 10%;
            left: 10%;
            width: 20px;
            height: 60px;
            background-color: #8B4513;
            border-radius: 5px;
        }
        .tree::after {
            content: '';
            position: absolute;
            top: -40px;
            left: -30px;
            width: 80px;
            height: 80px;
            background-color: #32CD32;
            border-radius: 50%;
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.2);
        }

        /* --- THE MONSTER --- */
        .monster {
            font-size: 100px;
            cursor: pointer;
            transition: transform 0.1s;
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.5));
            animation: float 3s ease-in-out infinite;
        }

        .monster:active {
            transform: scale(1.2);
        }

        /* Animation for the monster to float */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* --- THE BOTTOM UI BAR --- */
        #ui-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15vh;
            background-color: #5c4033; /* Dark wood/stone color */
            border-top: 5px solid #2a1f16;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            box-shadow: 0px -10px 20px rgba(0,0,0,0.5);
        }

        /* --- UI BUTTONS --- */
        .ui-btn {
            position: relative;
            width: 12%;
            height: 80%;
            background: linear-gradient(180deg, #8c7b6d 0%, #4a3b2c 100%);
            border: 3px solid #1a110a;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: inset 0px 5px 0px rgba(255,255,255,0.2), 0px 5px 10px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }

        .ui-btn:hover {
            background: linear-gradient(180deg, #a69686 0%, #5a4b3c 100%);
            transform: translateY(-2px);
        }

        .ui-btn:active {
            transform: translateY(2px);
            box-shadow: inset 0px 2px 0px rgba(255,255,255,0.2), 0px 2px 5px rgba(0,0,0,0.5);
        }

        .ui-icon {
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px black;
        }

        .ui-text {
            font-size: 10px;
            color: white;
            text-shadow: 1px 1px 0px black, -1px -1px 0px black, 1px -1px 0px black, -1px 1px 0px black;
            text-align: center;
            letter-spacing: 1px;
        }

        /* --- NOTIFICATION BADGE (Red Exclamation) --- */
        .badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: #e74c3c;
            color: white;
            border: 2px solid #c0392b;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Sale Banner */
        .sale-banner {
            position: absolute;
            top: -15px;
            background-color: #e74c3c;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 5px;
            border: 2px solid #c0392b;
            font-weight: bold;
            text-shadow: 1px 1px 0px black;
        }
    </style>
</head>
<body>

    <!-- THE ISLAND AREA -->
    <div id="island">
        <!-- A CSS Tree -->
        <div class="tree"></div>
        
        <!-- A Clickable Monster (Using an Emoji as a placeholder) -->
        <!-- In the future, you can replace this with an <img> tag or a CSS-drawn character -->
        <div class="monster" id="monster1" onclick="singMonster('monster1')">👾</div>
    </div>

    <!-- THE BOTTOM UI BAR -->
    <div id="ui-bar">
        
        <div class="ui-btn" onclick="openMenu('Collection')">
            <span class="ui-icon">📖</span>
            <span class="ui-text">COLLECTION</span>
            <div class="badge">!</div>
        </div>

        <div class="ui-btn" onclick="openMenu('Map')">
            <span class="ui-icon">🗺️</span>
            <span class="ui-text">MAP</span>
            <div class="badge">!</div>
        </div>

        <div class="ui-btn" onclick="openMenu('Mailbox')">
            <span class="ui-icon">📬</span>
            <span class="ui-text">MAILBOX</span>
            <div class="badge">!</div>
        </div>

        <div class="ui-btn" onclick="openMenu('Friends')">
            <span class="ui-icon">👥</span>
            <span class="ui-text">FRIENDS</span>
            <div class="badge">!</div>
        </div>

        <div class="ui-btn" onclick="openMenu('Market')">
            <div class="sale-banner">SALE</div>
            <span class="ui-icon">🏪</span>
            <span class="ui-text">MARKET</span>
        </div>

        <div class="ui-btn" onclick="openMenu('Info')">
            <span class="ui-icon">ℹ️</span>
            <span class="ui-text">INFO</span>
        </div>

        <div class="ui-btn" onclick="openMenu('Options')">
            <span class="ui-icon">⚙️</span>
            <span class="ui-text">OPTIONS</span>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // A simple audio context to generate a "beep" sound for the monster
        // (Since we can't load external MP3s in a single HTML file without a URL)
        let audioCtx = null;
        let isPlaying = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Function called when a monster is clicked
        function singMonster(monsterId) {
            initAudio();
            
            // Visual feedback
            const monster = document.getElementById(monsterId);
            monster.style.transform = "scale(1.3)";
            setTimeout(() => {
                monster.style.transform = "scale(1)";
            }, 150);

            // Audio feedback (Playing a simple synth note)
            // In a real MSM clone, you would play a looping backing track here.
            if (audioCtx) {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'triangle'; // Sounds kind of like a monster
                osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4 note
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // Function called when a UI button is clicked
        function openMenu(menuName) {
            // In a real game, this would open a modal or change the scene.
            // For now, we just alert the user.
            alert("Opening " + menuName + " menu!");
            
            // Remove the notification badge when clicked
            const buttons = document.querySelectorAll('.ui-btn');
            buttons.forEach(btn => {
                if (btn.innerText.includes(menuName.toUpperCase())) {
                    const badge = btn.querySelector('.badge');
                    if (badge) {
                        badge.style.display = 'none';
                    }
                }
            });
        }
    </script>
</body>
</html>

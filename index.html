<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Singing Monsters — Plant Island</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0b1a2b;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; user-select:none; }
  canvas { display:block; position:absolute; inset:0; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }

  /* ---------- HUD ---------- */
  #top {
    position:fixed; top:0; left:0; right:0; padding:14px 18px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
  }
  #island-name {
    font-size:20px; font-weight:800; letter-spacing:.5px; color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);
    background:rgba(20,40,25,.45); padding:8px 16px; border-radius:999px;
    backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.18);
  }
  #hint {
    font-size:12px; color:rgba(255,255,255,.75); font-weight:600;
    background:rgba(0,0,0,.3); padding:8px 14px; border-radius:999px;
    backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.12);
    text-align:right; line-height:1.5;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top">
  <div id="island-name">🌿 Plant Island</div>
  <div id="hint">Drag to pan • Scroll to zoom</div>
</div>

<script>
/* =========================================================================
   MY SINGING MONSTERS — PLANT ISLAND  (island only)
   Everything is drawn procedurally on a single canvas.
   ========================================================================= */

/* ------------------------------ CANVAS ------------------------------ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let DPR = 1, W = 0, H = 0, skyGrad = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0,    '#7fd4ff');
  skyGrad.addColorStop(0.45, '#a9e4ff');
  skyGrad.addColorStop(0.78, '#d9f2d0');
  skyGrad.addColorStop(1,    '#bfe6a8');
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------ STATE ------------------------------ */
const state = {
  cam: { x: 0, y: 0, zoom: 1 },
};

/* --------------------------- HELPERS --------------------------- */
function dot(x, y, r) {
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, Math.PI * 2);
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

/* ============================== DRAWING ============================== */

/* --------------------------- SKY & CLOUDS --------------------------- */
const clouds = Array.from({ length: 7 }, (_, i) => ({
  x: Math.random() * 2000,
  y: 0.06 + Math.random() * 0.5,
  s: 0.5 + Math.random() * 0.9,
  v: 6 + Math.random() * 14,
}));

function drawSky(t) {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // sun glow
  const g = ctx.createRadialGradient(W * 0.8, H * 0.12, 10, W * 0.8, H * 0.12, 320);
  g.addColorStop(0, 'rgba(255,255,220,.85)');
  g.addColorStop(1, 'rgba(255,255,220,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  for (const c of clouds) {
    const span = W + 500;
    const x = ((c.x + t * c.v) % span + span) % span - 250;
    drawCloud(x, c.y * H, c.s);
  }
}
function drawCloud(x, y, s) {
  ctx.save();
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  dot(x, y, 42 * s);
  dot(x + 48 * s, y + 10 * s, 30 * s);
  dot(x - 48 * s, y + 12 * s, 28 * s);
  dot(x + 14 * s, y - 20 * s, 32 * s);
  dot(x - 20 * s, y - 12 * s, 26 * s);
  ctx.fill();
  ctx.restore();
}

/* ------------------------------ ISLAND ------------------------------ */
function drawIsland(t) {
  ctx.save();
  // Center the island in the view
  ctx.translate(W / 2 + state.cam.x, H / 2 + 30 + state.cam.y);

  /* ---- 1. DROP SHADOW ---- */
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#000';
  ctx.translate(0, 140);
  ctx.scale(1, 0.35);
  ctx.beginPath();
  ctx.arc(0, 0, 320, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  /* ---- 2. DIRT CLIFF BASE (bottom layers) ---- */
  // Deep dark base
  ctx.fillStyle = '#5c3c1c';
  ctx.beginPath();
  ctx.moveTo(-300, -20);
  ctx.bezierCurveTo(-340, 80, -260, 200, 0, 240);
  ctx.bezierCurveTo(260, 200, 340, 80, 300, -20);
  ctx.closePath();
  ctx.fill();

  // Mid dirt layer
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath();
  ctx.moveTo(-280, -40);
  ctx.bezierCurveTo(-310, 70, -230, 180, 0, 215);
  ctx.bezierCurveTo(230, 180, 310, 70, 280, -40);
  ctx.closePath();
  ctx.fill();

  // Light dirt / tan layer just under the hedge
  ctx.fillStyle = '#d2b48c';
  ctx.beginPath();
  ctx.moveTo(-260, -60);
  ctx.bezierCurveTo(-280, 40, -200, 130, 0, 160);
  ctx.bezierCurveTo(200, 130, 280, 40, 260, -60);
  ctx.closePath();
  ctx.fill();

  // Adding some vertical dirt streaks for texture
  ctx.strokeStyle = 'rgba(90, 60, 30, 0.15)';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  for (let i = -200; i <= 200; i += 50) {
    if (Math.abs(i) < 60) continue;
    ctx.beginPath();
    ctx.moveTo(i, 60);
    ctx.lineTo(i * 0.9, 140);
    ctx.stroke();
  }

  /* ---- 3. WOODEN SIDE LOGS (the "ears") ---- */
  // Left log
  ctx.save();
  ctx.translate(-280, -40);
  ctx.rotate(-0.1);
  // Log body
  ctx.fillStyle = '#7b5433';
  ctx.beginPath();
  ctx.ellipse(0, 0, 50, 90, 0, 0, Math.PI * 2);
  ctx.fill();
  // Log end (cut surface)
  ctx.fillStyle = '#c49a6c';
  ctx.beginPath();
  ctx.ellipse(-10, 0, 35, 70, 0, 0, Math.PI * 2);
  ctx.fill();
  // Rings
  ctx.strokeStyle = '#a0744d';
  ctx.lineWidth = 3;
  for (let r = 15; r <= 30; r += 10) {
    ctx.beginPath();
    ctx.ellipse(-10, 0, r, r * 2, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  // Right log
  ctx.save();
  ctx.translate(280, -40);
  ctx.rotate(0.1);
  ctx.fillStyle = '#7b5433';
  ctx.beginPath();
  ctx.ellipse(0, 0, 50, 90, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#c49a6c';
  ctx.beginPath();
  ctx.ellipse(10, 0, 35, 70, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#a0744d';
  ctx.lineWidth = 3;
  for (let r = 15; r <= 30; r += 10) {
    ctx.beginPath();
    ctx.ellipse(10, 0, r, r * 2, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  /* ---- 4. HEDGE / BUSHY BORDER ---- */
  // The hedge is a thick ring of leaves around the top grass
  // We draw a dark green base first
  ctx.fillStyle = '#2d6a1f';
  ctx.beginPath();
  ctx.ellipse(0, -100, 300, 150, 0, 0, Math.PI * 2);
  ctx.fill();

  // A slightly lighter green layer
  ctx.fillStyle = '#3e8f34';
  ctx.beginPath();
  ctx.ellipse(0, -105, 290, 142, 0, 0, Math.PI * 2);
  ctx.fill();

  // Individual leafy bumps using arcs along the perimeter
  const hedgeBumps = 40;
  for (let i = 0; i < hedgeBumps; i++) {
    const a = (i / hedgeBumps) * Math.PI * 2;
    const rx = 295, ry = 148;
    const bx = Math.cos(a) * rx;
    const by = Math.sin(a) * ry - 100;
    const size = 22 + Math.sin(a * 5) * 8;
    
    ctx.fillStyle = i % 2 === 0 ? '#4e9c2e' : '#3e8f34';
    ctx.beginPath();
    ctx.arc(bx, by, size, 0, Math.PI * 2);
    ctx.fill();
    
    // Highlight
    ctx.fillStyle = 'rgba(150, 220, 100, 0.4)';
    ctx.beginPath();
    ctx.arc(bx - 4, by - 6, size * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ---- 5. TOP GRASS PLATEAU ---- */
  // Base green
  ctx.fillStyle = '#6abf40';
  ctx.beginPath();
  ctx.ellipse(0, -110, 270, 130, 0, 0, Math.PI * 2);
  ctx.fill();

  // Gradient to give it a slight dome look
  const grassGrad = ctx.createRadialGradient(-50, -150, 20, 0, -110, 280);
  grassGrad.addColorStop(0, '#82d654');
  grassGrad.addColorStop(0.6, '#6abf40');
  grassGrad.addColorStop(1, '#4b9629');
  ctx.fillStyle = grassGrad;
  ctx.beginPath();
  ctx.ellipse(0, -110, 270, 130, 0, 0, Math.PI * 2);
  ctx.fill();

  // Subtle inner shadow for depth
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 15;
  ctx.beginPath();
  ctx.ellipse(0, -110, 260, 120, 0, 0, Math.PI * 2);
  ctx.stroke();

  /* ---- 6. WOODEN DOOR / HATCH AT THE BOTTOM ---- */
  // Positioned at the bottom center of the dirt cliff
  ctx.save();
  ctx.translate(0, 150);

  // Door arch (dark outline)
  ctx.fillStyle = '#4a2e1b';
  ctx.beginPath();
  ctx.moveTo(-45, 40);
  ctx.lineTo(-45, 0);
  ctx.arc(0, 0, 45, Math.PI, 0);
  ctx.lineTo(45, 40);
  ctx.closePath();
  ctx.fill();

  // Door fill (wooden planks)
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath();
  ctx.moveTo(-38, 40);
  ctx.lineTo(-38, 0);
  ctx.arc(0, 0, 38, Math.PI, 0);
  ctx.lineTo(38, 40);
  ctx.closePath();
  ctx.fill();

  // Vertical plank lines
  ctx.strokeStyle = '#5c3c1c';
  ctx.lineWidth = 3;
  for (let x = -30; x <= 30; x += 15) {
    ctx.beginPath();
    ctx.moveTo(x, 40);
    ctx.lineTo(x, -30);
    ctx.stroke();
  }

  // Horizontal crossbeam
  ctx.fillStyle = '#5c3c1c';
  roundRect(-40, 10, 80, 8, 2);
  ctx.fill();

  // Little doorknob
  ctx.fillStyle = '#c49a6c';
  ctx.beginPath();
  ctx.arc(25, 25, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  /* ---- 7. VINES HANGING FROM THE HEDGE ---- */
  ctx.strokeStyle = '#3e8f34';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  const vines = [
    { x: -180, y: -40, len: 60, sway: 0.2 },
    { x: -100, y: -10, len: 80, sway: -0.1 },
    { x: 100,  y: -10, len: 80, sway: 0.1 },
    { x: 180,  y: -40, len: 60, sway: -0.2 },
    { x: -220, y: -60, len: 45, sway: 0.15 },
    { x: 220,  y: -60, len: 45, sway: -0.15 },
  ];

  for (const v of vines) {
    const sway = Math.sin(t * 1.5 + v.x) * 5 * v.sway;
    ctx.beginPath();
    ctx.moveTo(v.x, v.y);
    ctx.quadraticCurveTo(v.x + sway, v.y + v.len * 0.6, v.x + sway * 1.5, v.y + v.len);
    ctx.stroke();

    // A few leaves on the vine
    ctx.fillStyle = '#4e9c2e';
    ctx.beginPath();
    ctx.ellipse(v.x + sway, v.y + v.len * 0.5, 8, 5, 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

/* ------------------------------ VIGNETTE ------------------------------ */
function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35,
                                     W / 2, H / 2, Math.max(W, H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,20,40,0.28)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ============================== LOOP ============================== */
function render(now) {
  const t = now / 1000;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky(t);
  drawIsland(t);
  drawVignette();

  requestAnimationFrame(render);
}

/* ============================ INTERACTION ============================ */
let isDragging = false;
let lastX = 0, lastY = 0;

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  state.cam.x += dx;
  state.cam.y += dy;
  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener('pointerup', () => { isDragging = false; });
canvas.addEventListener('pointercancel', () => { isDragging = false; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const z = state.cam.zoom;
  const nz = Math.min(2.2, Math.max(0.45, z * (e.deltaY > 0 ? 0.9 : 1.1)));

  // Zoom towards cursor
  const wx = (e.clientX - W / 2 - state.cam.x) / z;
  const wy = (e.clientY - H / 2 - state.cam.y) / z;
  state.cam.x = e.clientX - W / 2 - wx * nz;
  state.cam.y = e.clientY - H / 2 - wy * nz;
  state.cam.zoom = nz;
}, { passive: false });

/* ------------------------- INITIAL CAMERA FIT ------------------------- */
function fitCamera() {
  state.cam.zoom = Math.max(0.45, Math.min(1.0, Math.min(W / 1300, H / 900)));
  state.cam.x = 0;
  state.cam.y = 0;
}
fitCamera();

/* ------------------------------ GO! ------------------------------ */
requestAnimationFrame(render);
</script>
</body>
</html>

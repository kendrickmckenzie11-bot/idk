<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLM 5.2 (free) · OpenRouter Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f12;
            color: #e4e4e7;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 860px;
            margin: 0 auto;
            padding: 1rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #27272a;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        h1 { font-size: 1.1rem; font-weight: 500; color: #c4b5fd; }
        .key-area { display: flex; gap: 0.5rem; align-items: center; }
        .key-area input {
            background: #18181b;
            border: 1px solid #3f3f46;
            color: #e4e4e7;
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            font-size: 0.8rem;
            width: 220px;
        }
        .key-area input:focus { outline: 1px solid #8b5cf6; border-color: #8b5cf6; }
        #chat {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 0.5rem 0;
            scroll-behavior: smooth;
        }
        .msg {
            max-width: 85%;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            line-height: 1.55;
            font-size: 0.92rem;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg.user {
            align-self: flex-end;
            background: #4c1d95;
            color: #f3e8ff;
            border-bottom-right-radius: 3px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: #18181b;
            border: 1px solid #27272a;
            color: #d4d4d8;
            border-bottom-left-radius: 3px;
        }
        .msg.system {
            align-self: center;
            background: transparent;
            color: #71717a;
            font-size: 0.8rem;
            font-style: italic;
            max-width: 100%;
        }
        .msg.error { border-color: #7f1d1d; background: #1c0a0a; color: #fca5a5; }
        #input-area {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid #27272a;
        }
        #prompt {
            flex: 1;
            background: #18181b;
            border: 1px solid #3f3f46;
            color: #e4e4e7;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.92rem;
            font-family: inherit;
            resize: none;
            min-height: 52px;
            max-height: 150px;
        }
        #prompt:focus { outline: 1px solid #8b5cf6; border-color: #8b5cf6; }
        button {
            background: #7c3aed;
            border: none;
            color: white;
            padding: 0 1.4rem;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            min-height: 52px;
        }
        button:hover:not(:disabled) { background: #6d28d9; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .status {
            font-size: 0.75rem;
            color: #71717a;
            margin-left: 0.5rem;
        }
        .reasoning {
            font-size: 0.8rem;
            color: #a78bfa;
            font-style: italic;
            padding: 0.4rem 0.8rem;
            margin-top: 0.3rem;
            border-left: 2px solid #4c1d95;
            background: #0f0f12;
            border-radius: 0 6px 6px 0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <header>
        <h1>🧠 GLM 5.2 (free) · OpenRouter</h1>
        <div class="key-area">
            <input type="password" id="apiKey" placeholder="sk-or-v1-..." autocomplete="off">
            <span class="status" id="status"></span>
        </div>
    </header>

    <div id="chat">
        <div class="msg system">Enter your OpenRouter API key above, then start chatting with GLM 5.2.</div>
    </div>

    <div id="input-area">
        <textarea id="prompt" rows="1" placeholder="Ask GLM 5.2 anything..."></textarea>
        <button id="sendBtn">Send</button>
    </div>

    <script>
        const chatEl      = document.getElementById('chat');
        const promptEl    = document.getElementById('prompt');
        const sendBtn     = document.getElementById('sendBtn');
        const apiKeyEl    = document.getElementById('apiKey');
        const statusEl    = document.getElementById('status');

        // ---- conversation history (sent on every request) ----
        let messages = [
            { role: 'system', content: 'You are GLM 5.2, a helpful and harmless AI assistant.' }
        ];

        let isGenerating = false;

        // ---- UI helpers ----
        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = text;
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
            return div;
        }

        function updateStatus(txt) {
            statusEl.textContent = txt;
        }

        // ---- streaming-aware send ----
        async function sendMessage() {
            const apiKey = apiKeyEl.value.trim();
            if (!apiKey) {
                updateStatus('⚠️ API key required');
                apiKeyEl.focus();
                return;
            }

            const userText = promptEl.value.trim();
            if (!userText || isGenerating) return;

            promptEl.value = '';
            promptEl.style.height = 'auto';

            // push user turn
            messages.push({ role: 'user', content: userText });
            addMessage('user', userText);

            // placeholder for assistant
            const assistantDiv = addMessage('assistant', '');
            assistantDiv.textContent = '▍';  // caret

            isGenerating = true;
            sendBtn.disabled = true;
            updateStatus('⏳ generating...');

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                        // optional attribution headers
                        'HTTP-Referer': 'https://localhost',
                        'X-OpenRouter-Title': 'GLM 5.2 Free Chat'
                    },
                    body: JSON.stringify({
                        model: 'z-ai/glm-5.2:free',
                        messages: messages,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`${response.status} — ${err.slice(0, 300)}`);
                }

                // ---- parse SSE stream ----
                const reader  = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer    = '';
                let fullText  = '';
                let reasoningText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data:')) continue;
                        const data = trimmed.slice(5).trim();
                        if (data === '[DONE]') continue;

                        try {
                            const parsed = JSON.parse(data);
                            const delta  = parsed.choices?.[0]?.delta;
                            if (!delta) continue;

                            // reasoning tokens (GLM 5.2 supports reasoning effort)
                            if (delta.reasoning || delta.reasoning_content) {
                                reasoningText += delta.reasoning || delta.reasoning_content || '';
                            }

                            // main content
                            if (delta.content) {
                                fullText += delta.content;
                                assistantDiv.textContent = fullText + '▍';
                                chatEl.scrollTop = chatEl.scrollHeight;
                            }
                        } catch (_) {
                            // ignore comment / malformed lines
                        }
                    }
                }

                // finalize assistant bubble
                assistantDiv.textContent = fullText || '(empty response)';

                // if reasoning was streamed, show it in a small panel
                if (reasoningText.trim()) {
                    const reasonDiv = document.createElement('div');
                    reasonDiv.className = 'reasoning';
                    reasonDiv.textContent = '🧠 ' + reasoningText.trim();
                    assistantDiv.appendChild(reasonDiv);
                }

                // record assistant turn for context
                messages.push({ role: 'assistant', content: fullText });
                updateStatus('✅ done');

            } catch (err) {
                assistantDiv.className = 'msg assistant error';
                assistantDiv.textContent = '⚠️ ' + err.message;
                updateStatus('❌ error');
                // remove failed assistant turn from history
                messages.pop();
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
                promptEl.focus();
            }
        }

        // ---- event listeners ----
        sendBtn.addEventListener('click', sendMessage);

        promptEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // auto-resize textarea
        promptEl.addEventListener('input', () => {
            promptEl.style.height = 'auto';
            promptEl.style.height = Math.min(promptEl.scrollHeight, 150) + 'px';
        });

        // quick sanity check on key input
        apiKeyEl.addEventListener('input', () => {
            const val = apiKeyEl.value.trim();
            updateStatus(val.length > 10 ? '🔑 key ready' : '');
        });

        promptEl.focus();
    </script>
</body>
</html>

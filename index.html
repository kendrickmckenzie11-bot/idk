<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grey Baseplate</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc6e8; }
  canvas { display: block; }

  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border-radius: 50%;
    background: rgba(255,255,255,.9);
    box-shadow: 0 0 3px rgba(0,0,0,.7);
    pointer-events: none; opacity: 0; transition: opacity .2s;
  }
  #crosshair.show { opacity: 1; }

  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(0,0,0,.55); color: #fff; text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    cursor: pointer; user-select: none;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: 34px; letter-spacing: .5px; }
  #overlay p { margin: 0; font-size: 15px; line-height: 1.6; opacity: .85; }
  #overlay strong { font-size: 18px; opacity: 1; }
</style>
</head>
<body>

<div id="crosshair"></div>

<div id="overlay">
  <h1>Grey Baseplate</h1>
  <p><strong>Click to play</strong></p>
  <p>WASD — walk &nbsp;·&nbsp; Mouse — look &nbsp;·&nbsp; Space — jump &nbsp;·&nbsp; Shift — run &nbsp;·&nbsp; Esc — release</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// ---------- Tunables ----------
const EYE_HEIGHT  = 1.7;   // camera height above the plate
const WALK_SPEED  = 5;     // units / second
const RUN_SPEED   = 9;
const GRAVITY     = 25;
const JUMP_SPEED  = 9;
const HALF        = 500;   // baseplate is 1000 x 1000, so half = 500

// ---------- State ----------
let scene, camera, renderer, controls;

const clock    = new THREE.Clock();
const velocity = new THREE.Vector3();
const keys     = Object.create(null);
let canJump    = true;

// Scratch vectors (avoid allocating every frame)
const forward = new THREE.Vector3();
const right   = new THREE.Vector3();
const wish    = new THREE.Vector3();

init();
animate();

// ---------- Setup ----------
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fc6e8);
  scene.fog = new THREE.Fog(0x9fc6e8, 150, 520);

  camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 2000);
  camera.position.set(0, EYE_HEIGHT, 0);

  // Lights
  scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(80, 150, 60);
  scene.add(sun);

  // Grey baseplate
  const plateGeo = new THREE.PlaneGeometry(HALF * 2, HALF * 2);
  plateGeo.rotateX(-Math.PI / 2);
  const plate = new THREE.Mesh(
    plateGeo,
    new THREE.MeshLambertMaterial({ color: 0x808080 })
  );
  scene.add(plate);

  // Faint grid so you can actually feel yourself moving
  const grid = new THREE.GridHelper(HALF * 2, 100, 0x000000, 0x000000);
  grid.material.transparent = true;
  grid.material.opacity = 0.12;
  grid.position.y = 0.02;
  scene.add(grid);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  // Mouse-look controls
  controls = new PointerLockControls(camera, renderer.domElement);

  const overlay   = document.getElementById('overlay');
  const crosshair = document.getElementById('crosshair');

  overlay.addEventListener('click', () => controls.lock());
  controls.addEventListener('lock', () => {
    overlay.classList.add('hidden');
    crosshair.classList.add('show');
  });
  controls.addEventListener('unlock', () => {
    overlay.classList.remove('hidden');
    crosshair.classList.remove('show');
  });

  // Keyboard
  addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
  });
  addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });
  addEventListener('blur', () => {
    for (const k in keys) keys[k] = false;
  });

  // Resize
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

// ---------- Main loop ----------
function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  if (controls.isLocked) {
    // --- Horizontal movement ---
    camera.getWorldDirection(forward);
    forward.y = 0;
    if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);
    forward.normalize();

    right.crossVectors(forward, camera.up).normalize();

    const moveZ = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
    const moveX = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);

    wish.set(0, 0, 0)
        .addScaledVector(forward, moveZ)
        .addScaledVector(right,   moveX);
    if (wish.lengthSq() > 0) wish.normalize();

    const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? RUN_SPEED : WALK_SPEED;

    // Smooth accel / decel
    velocity.x = THREE.MathUtils.damp(velocity.x, wish.x * speed, 12, delta);
    velocity.z = THREE.MathUtils.damp(velocity.z, wish.z * speed, 12, delta);

    camera.position.x += velocity.x * delta;
    camera.position.z += velocity.z * delta;

    // Keep on the plate
    camera.position.x = THREE.MathUtils.clamp(camera.position.x, -HALF + 1, HALF - 1);
    camera.position.z = THREE.MathUtils.clamp(camera.position.z, -HALF + 1, HALF - 1);

    // --- Vertical movement (gravity + jump) ---
    velocity.y -= GRAVITY * delta;
    camera.position.y += velocity.y * delta;

    if (camera.position.y <= EYE_HEIGHT) {
      camera.position.y = EYE_HEIGHT;
      velocity.y = 0;
      canJump = true;
    }

    if (keys['Space'] && canJump) {
      velocity.y = JUMP_SPEED;
      canJump = false;
    }
  } else {
    velocity.set(0, 0, 0);
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>

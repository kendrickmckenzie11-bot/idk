<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nyxara — The First Islet</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0b001a;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; user-select:none; }
  canvas { display:block; position:absolute; inset:0; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }

  #top {
    position:fixed; top:0; left:0; right:0; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; z-index:10;
  }
  #island-name {
    font-size:24px; font-weight:900; letter-spacing:1px; color:#fff;
    text-shadow:0 0 20px rgba(180,100,255,.8), 0 2px 0 rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.4);
    background:rgba(30,10,50,.6); padding:10px 22px; border-radius:999px;
    backdrop-filter:blur(10px); border:1px solid rgba(200,150,255,.3);
  }
  #island-name small {
    display:block; font-size:11px; font-weight:700; letter-spacing:3px;
    color:#b89aff; text-transform:uppercase; margin-top:3px;
  }
  #hint {
    font-size:12px; color:rgba(220,200,255,.8); font-weight:600;
    background:rgba(10,0,25,.5); padding:8px 16px; border-radius:999px;
    backdrop-filter:blur(8px); border:1px solid rgba(180,120,255,.2);
    text-align:right; line-height:1.6;
  }

  /* Audio start prompt */
  #audio-prompt {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(5,0,15,.55); backdrop-filter:blur(6px);
    z-index:50; cursor:pointer; transition:opacity .6s ease;
  }
  #audio-prompt.hide { opacity:0; pointer-events:none; }
  #audio-prompt .card {
    background:rgba(30,10,55,.9); border:1px solid rgba(200,150,255,.4);
    padding:32px 44px; border-radius:24px; text-align:center;
    box-shadow:0 0 60px rgba(180,100,255,.4);
  }
  #audio-prompt h2 { color:#fff; font-size:22px; font-weight:800; letter-spacing:1px; }
  #audio-prompt p { color:#b89aff; font-size:13px; margin-top:8px; letter-spacing:1px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top">
  <div id="island-name">🌌 Nyxara<small>The First Islet</small></div>
  <div id="hint">Drag to pan • Scroll to zoom</div>
</div>

<div id="audio-prompt">
  <div class="card">
    <h2>Tap to Awaken the Castle</h2>
    <p>♫ The song of Nyxara begins ♫</p>
  </div>
</div>

<script>
/* =========================================================================
   NYXARA — Cosmic Islet with Castle
   ========================================================================= */

/* ------------------------------ CANVAS ------------------------------ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let DPR = 1, W = 0, H = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------ STATE ------------------------------ */
const state = {
  cam: { x: 0, y: 0, zoom: 1 },
};

/* --------------------------- HELPERS --------------------------- */
function roundRect(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* =========================================================================
   AUDIO — Castle deep bass drone (ethereal / mysterious)
   ========================================================================= */
let audioCtx = null, castleGain = null, audioStarted = false;

function initAudio() {
  if (audioStarted) return;
  audioStarted = true;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Master gain for the castle drone
  castleGain = audioCtx.createGain();
  castleGain.gain.value = 0.0; // fade in
  castleGain.connect(audioCtx.destination);

  // Low-pass filter to keep it warm and deep
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 320;
  lp.Q.value = 0.8;
  lp.connect(castleGain);

  // A slow LFO modulating the filter for a "breathing" mystery
  const lfoFilter = audioCtx.createOscillator();
  lfoFilter.frequency.value = 0.07;
  const lfoFilterGain = audioCtx.createGain();
  lfoFilterGain.gain.value = 90;
  lfoFilter.connect(lfoFilterGain);
  lfoFilterGain.connect(lp.frequency);
  lfoFilter.start();

  // A slow amplitude LFO for a swelling pad
  const lfoAmp = audioCtx.createOscillator();
  lfoAmp.frequency.value = 0.11;
  const lfoAmpGain = audioCtx.createGain();
  lfoAmpGain.gain.value = 0.25;
  lfoAmp.connect(lfoAmpGain);

  // Deep bass chord — root + fifth + octave + sub
  // A1 = 55 Hz, E2 = 82.4, A2 = 110, A0 = 27.5 (sub)
  const notes = [
    { f: 27.5,  g: 0.35, type: 'sine'     },
    { f: 55.0,  g: 0.55, type: 'sine'     },
    { f: 82.4,  g: 0.30, type: 'triangle' },
    { f: 110.0, g: 0.18, type: 'sine'     },
    { f: 165.0, g: 0.10, type: 'triangle' }, // hint of the fifth above
  ];

  notes.forEach((n, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = n.type;
    osc.frequency.value = n.f;

    // Slight detune for a chorus-like shimmer
    osc.detune.value = (i - 2) * 4;

    const g = audioCtx.createGain();
    g.gain.value = n.g;

    // Route through amplitude LFO
    lfoAmpGain.connect(g.gain);

    osc.connect(g);
    g.connect(lp);
    osc.start();
  });

  lfoAmp.start();

  // Gentle fade in
  const now = audioCtx.currentTime;
  castleGain.gain.setValueAtTime(0.0001, now);
  castleGain.gain.linearRampToValueAtTime(0.55, now + 4.0);

  // Hide the prompt
  document.getElementById('audio-prompt').classList.add('hide');
}

document.getElementById('audio-prompt').addEventListener('click', initAudio);
canvas.addEventListener('pointerdown', initAudio, { once: true });

/* ------------------------------ SPACE BACKDROP ------------------------------ */
const stars = (() => {
  const rnd = mulberry32(42);
  const out = [];
  for (let i = 0; i < 420; i++) {
    out.push({
      x: rnd() * 2400 - 700,
      y: rnd() * 2400 - 700,
      r: 0.5 + rnd() * 2.2,
      a: 0.3 + rnd() * 0.7,
      tw: rnd() * Math.PI * 2,
      spd: 0.5 + rnd() * 2,
      col: rnd() > 0.85 ? '#aaddff' : (rnd() > 0.65 ? '#ffccff' : '#ffffff'),
    });
  }
  return out;
})();

const nebulae = [
  { x: 0.15, y: 0.25, r: 460, c1: 'rgba(255,0,150,0.13)', c2: 'rgba(255,0,150,0)' },
  { x: 0.85, y: 0.35, r: 540, c1: 'rgba(0,200,255,0.11)', c2: 'rgba(0,200,255,0)' },
  { x: 0.50, y: 0.80, r: 620, c1: 'rgba(150,0,255,0.11)', c2: 'rgba(150,0,255,0)' },
  { x: 0.22, y: 0.82, r: 420, c1: 'rgba(0,255,200,0.08)', c2: 'rgba(0,255,200,0)' },
];

function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.0, '#05000a');
  g.addColorStop(0.3, '#0f0025');
  g.addColorStop(0.7, '#1a0035');
  g.addColorStop(1.0, '#0d001a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const n of nebulae) {
    const nx = n.x * W + Math.sin(t * 0.05 + n.x * 10) * 24;
    const ny = n.y * H + Math.cos(t * 0.04 + n.y * 10) * 24;
    const rg = ctx.createRadialGradient(nx, ny, 10, nx, ny, n.r);
    rg.addColorStop(0, n.c1);
    rg.addColorStop(1, n.c2);
    ctx.fillStyle = rg;
    ctx.fillRect(nx - n.r, ny - n.r, n.r * 2, n.r * 2);
  }
  ctx.restore();

  for (const s of stars) {
    const alpha = s.a * (0.6 + 0.4 * Math.sin(t * s.spd + s.tw));
    const sx = (s.x + W / 2) % (W + 1400) - 700;
    const sy = (s.y + H / 2) % (H + 1400) - 700;
    ctx.fillStyle = s.col;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ======================= ISLAND GEOMETRY ======================= */
const RX  = 520;
const RY  = 260;
const GRX = 440;
const GRY = 200;
const BOT = 420;

/* ----------------------------- CRYSTAL SPIKE ----------------------------- */
function drawCrystalSpike(x, y, angle, size, hue, alpha = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  const len = size * 2.5;
  const wid = size * 0.8;

  ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${alpha * 0.85})`;
  ctx.shadowBlur = 22;

  const grad = ctx.createLinearGradient(0, 0, len, 0);
  grad.addColorStop(0,   `hsla(${hue}, 90%, 45%, ${alpha})`);
  grad.addColorStop(0.5, `hsla(${hue + 30}, 90%, 65%, ${alpha})`);
  grad.addColorStop(1,   `hsla(${hue + 60}, 90%, 82%, ${alpha})`);

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, -wid);
  ctx.lineTo(len, 0);
  ctx.lineTo(0, wid);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = `hsla(${hue + 60}, 100%, 92%, ${alpha * 0.5})`;
  ctx.beginPath();
  ctx.moveTo(0, -wid * 0.4);
  ctx.lineTo(len * 0.8, 0);
  ctx.lineTo(0, 0);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

/* ----------------------------- SIDE PLATFORMS ----------------------------- */
/* Left platform: Breed Synthesizer. Right: Incubation Center. */
const platforms = {
  left:  { cx: -640, cy: 70,  rx: 155, ry: 78 },
  right: { cx:  640, cy: 70,  rx: 155, ry: 78 },
};

function drawPlatformBase(p, t, side) {
  // Teal base disc
  const g = ctx.createLinearGradient(0, p.cy - p.ry, 0, p.cy + p.ry + 60);
  g.addColorStop(0, '#0089aa');
  g.addColorStop(0.6, '#00aacc');
  g.addColorStop(1, '#006688');

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(p.cx, p.cy, p.rx, p.ry, 0, 0, Math.PI * 2);
  ctx.fill();

  // Underside shadow
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#00303f';
  ctx.beginPath();
  ctx.ellipse(p.cx, p.cy + 20, p.rx * 0.9, p.ry * 0.9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Crystal rim around the platform
  const BUMPS = 26;
  for (let i = 0; i < BUMPS; i++) {
    const a = (i / BUMPS) * Math.PI * 2;
    // Only draw the outward-facing arcs (skip where it connects to the bridge)
    const bx = p.cx + Math.cos(a) * p.rx;
    const by = p.cy + Math.sin(a) * p.ry;
    const size = 10 + Math.sin(i * 1.9) * 4;
    const hue = 200 + Math.sin(a) * 40;
    drawCrystalSpike(bx, by, a, size, hue, 0.8);
  }

  // Glowing centre pool
  ctx.save();
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 24;
  const pg = ctx.createRadialGradient(p.cx, p.cy - 4, 4, p.cx, p.cy - 4, p.rx * 0.85);
  pg.addColorStop(0, 'rgba(180,255,255,0.35)');
  pg.addColorStop(1, 'rgba(0,120,180,0)');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.ellipse(p.cx, p.cy - 4, p.rx * 0.85, p.ry * 0.85, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBridge(side, t) {
  const startX = side === 'left' ? -RX + 30 : RX - 30;
  const endX   = side === 'left' ? platforms.left.cx + platforms.left.rx * 0.8
                                  : platforms.right.cx - platforms.right.rx * 0.8;
  const y = 60;

  // Bridge beam
  const g = ctx.createLinearGradient(0, y - 14, 0, y + 22);
  g.addColorStop(0, '#007799');
  g.addColorStop(0.5, '#00bbdd');
  g.addColorStop(1, '#006688');
  ctx.fillStyle = g;
  roundRect(Math.min(startX, endX), y - 14, Math.abs(endX - startX), 36, 14);
  ctx.fill();

  // Glowing top line
  ctx.save();
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 12;
  ctx.strokeStyle = 'rgba(150,255,255,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(Math.min(startX, endX) + 6, y - 6);
  ctx.lineTo(Math.max(startX, endX) - 6, y - 6);
  ctx.stroke();
  ctx.restore();

  // Support pylons
  const steps = 5;
  for (let i = 1; i < steps; i++) {
    const px = startX + (endX - startX) * (i / steps);
    ctx.fillStyle = 'rgba(0,150,190,0.6)';
    ctx.beginPath();
    ctx.moveTo(px - 6, y + 20);
    ctx.lineTo(px, y + 42);
    ctx.lineTo(px + 6, y + 20);
    ctx.closePath();
    ctx.fill();
  }
}

/* ----------------------------- CASTLE ----------------------------- */
/* Sits at the back of the island surface. Dark crystal architecture. */
const castle = { cx: 0, cy: -150, s: 1 };

function drawCastle(t) {
  const { cx, cy, s } = castle;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);

  const pulse = 0.85 + 0.15 * Math.sin(t * 1.4);
  const pulse2 = 0.85 + 0.15 * Math.sin(t * 1.4 + 1.6);

  /* ---- shadow on the void ---- */
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, 34, 150, 34, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  /* ---- main obsidian platform ---- */
  ctx.fillStyle = '#0d0018';
  ctx.beginPath();
  ctx.ellipse(0, 26, 148, 32, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#1a0033';
  ctx.beginPath();
  ctx.ellipse(0, 22, 140, 28, 0, 0, Math.PI * 2);
  ctx.fill();

  // Glowing rune ring on the platform
  ctx.save();
  ctx.strokeStyle = `rgba(200,120,255,${0.6 * pulse})`;
  ctx.lineWidth = 3;
  ctx.shadowColor = '#b44aff';
  ctx.shadowBlur = 14 * pulse;
  ctx.beginPath();
  ctx.ellipse(0, 22, 110, 20, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  /* ---- side towers ---- */
  const towers = [
    { x: -78, h: 120, w: 44, hue: 280 },
    { x:  78, h: 120, w: 44, hue: 280 },
    { x: -42, h: 170, w: 38, hue: 300 },
    { x:  42, h: 170, w: 38, hue: 300 },
  ];
  for (const tw of towers) {
    drawTower(tw.x, 26, tw.w, tw.h, tw.hue, t, 0);
  }

  /* ---- main central spire ---- */
  drawMainSpire(0, 26, t, pulse);

  /* ---- floating crystals orbiting the spire ---- */
  for (let i = 0; i < 3; i++) {
    const a = t * 0.6 + i * (Math.PI * 2 / 3);
    const orbitX = Math.cos(a) * 90;
    const orbitY = -160 + Math.sin(a) * 18;
    const sz = 7 + Math.sin(t * 2 + i) * 2;
    ctx.save();
    ctx.translate(orbitX, orbitY);
    ctx.rotate(a);
    ctx.fillStyle = `hsla(${290 + i * 15}, 100%, 75%, 0.9)`;
    ctx.shadowColor = `hsla(${290 + i * 15}, 100%, 65%, 0.9)`;
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.moveTo(0, -sz);
    ctx.lineTo(sz * 0.6, 0);
    ctx.lineTo(0, sz);
    ctx.lineTo(-sz * 0.6, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* ---- ground glow under the castle ---- */
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const gg = ctx.createRadialGradient(0, 26, 6, 0, 26, 220);
  gg.addColorStop(0, `rgba(180,90,255,${0.18 * pulse})`);
  gg.addColorStop(1, 'rgba(180,90,255,0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.ellipse(0, 26, 220, 60, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawTower(x, baseY, w, h, hue, t, offset) {
  // tower body (tapered obelisk)
  const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  g.addColorStop(0,   '#10001f');
  g.addColorStop(0.5, '#2a004a');
  g.addColorStop(1,   '#08001a');

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - w / 2, baseY);
  ctx.lineTo(x - w * 0.32, baseY - h);
  ctx.lineTo(x + w * 0.32, baseY - h);
  ctx.lineTo(x + w / 2, baseY);
  ctx.closePath();
  ctx.fill();

  // left edge highlight
  ctx.fillStyle = 'rgba(180,120,255,0.20)';
  ctx.beginPath();
  ctx.moveTo(x - w / 2, baseY);
  ctx.lineTo(x - w * 0.32, baseY - h);
  ctx.lineTo(x - w * 0.20, baseY - h);
  ctx.lineTo(x - w * 0.34, baseY);
  ctx.closePath();
  ctx.fill();

  // crystal cap
  const capSz = w * 0.42;
  const pulse = 0.8 + 0.2 * Math.sin(t * 2 + offset);
  ctx.save();
  ctx.shadowColor = `hsl(${hue}, 100%, 65%)`;
  ctx.shadowBlur = 18 * pulse;
  ctx.fillStyle = `hsl(${hue}, 90%, 70%)`;
  ctx.beginPath();
  ctx.moveTo(x, baseY - h - capSz * 1.8);
  ctx.lineTo(x + capSz, baseY - h);
  ctx.lineTo(x, baseY - h + capSz * 0.4);
  ctx.lineTo(x - capSz, baseY - h);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // glowing window
  ctx.save();
  ctx.shadowColor = `hsl(${hue}, 100%, 70%)`;
  ctx.shadowBlur = 10 * pulse;
  ctx.fillStyle = `hsla(${hue}, 100%, 78%, ${0.75 * pulse})`;
  roundRect(x - w * 0.14, baseY - h * 0.6, w * 0.28, h * 0.16, 4);
  ctx.fill();
  ctx.restore();
}

function drawMainSpire(x, baseY, t, pulse) {
  const H = 320;
  const W0 = 62;

  // Main body
  const g = ctx.createLinearGradient(x - W0 / 2, 0, x + W0 / 2, 0);
  g.addColorStop(0,   '#0d001a');
  g.addColorStop(0.4, '#2c0050');
  g.addColorStop(0.6, '#3a0066');
  g.addColorStop(1,   '#08001a');

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - W0 / 2, baseY);
  ctx.lineTo(x - W0 * 0.22, baseY - H * 0.72);
  ctx.lineTo(x + W0 * 0.22, baseY - H * 0.72);
  ctx.lineTo(x + W0 / 2, baseY);
  ctx.closePath();
  ctx.fill();

  // left lit edge
  ctx.fillStyle = 'rgba(200,140,255,0.22)';
  ctx.beginPath();
  ctx.moveTo(x - W0 / 2, baseY);
  ctx.lineTo(x - W0 * 0.22, baseY - H * 0.72);
  ctx.lineTo(x - W0 * 0.10, baseY - H * 0.72);
  ctx.lineTo(x - W0 * 0.28, baseY);
  ctx.closePath();
  ctx.fill();

  // Rune lines along the spire
  ctx.strokeStyle = `rgba(200,130,255,${0.35 + 0.3 * pulse})`;
  ctx.lineWidth = 2;
  for (let i = 1; i <= 5; i++) {
    const ry = baseY - H * 0.72 * (i / 6);
    const rw = W0 * 0.5 * (1 - i * 0.12);
    ctx.beginPath();
    ctx.moveTo(x - rw, ry);
    ctx.lineTo(x + rw, ry);
    ctx.stroke();
  }

  // Glowing windows
  ctx.save();
  ctx.shadowColor = '#c87aff';
  ctx.shadowBlur = 14 * pulse;
  ctx.fillStyle = `rgba(230,180,255,${0.85 * pulse})`;
  for (let i = 0; i < 3; i++) {
    const wy = baseY - H * 0.18 - i * 60;
    const ww = 14;
    roundRect(x - ww / 2, wy - 10, ww, 22, 4);
    ctx.fill();
  }
  ctx.restore();

  // Upper tapered section
  ctx.fillStyle = '#1a0033';
  ctx.beginPath();
  ctx.moveTo(x - W0 * 0.22, baseY - H * 0.72);
  ctx.lineTo(x - 8, baseY - H * 0.95);
  ctx.lineTo(x + 8, baseY - H * 0.95);
  ctx.lineTo(x + W0 * 0.22, baseY - H * 0.72);
  ctx.closePath();
  ctx.fill();

  // Floating crown crystal
  const cy = baseY - H * 0.95 - 40;
  const cr = 30;
  ctx.save();
  ctx.shadowColor = '#d090ff';
  ctx.shadowBlur = 30 * pulse;
  const cg = ctx.createRadialGradient(x, cy, 4, x, cy, cr);
  cg.addColorStop(0, `rgba(255,220,255,${0.95 * pulse})`);
  cg.addColorStop(0.5, `rgba(210,120,255,${0.75 * pulse})`);
  cg.addColorStop(1, 'rgba(140,60,200,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(x, cy, cr, 0, Math.PI * 2);
  ctx.fill();

  // Inner bright core
  ctx.fillStyle = `rgba(255,240,255,${0.9 * pulse})`;
  ctx.beginPath();
  ctx.arc(x, cy, cr * 0.32, 0, Math.PI * 2);
  ctx.fill();

  // Diamond crystal around it
  ctx.strokeStyle = `rgba(230,180,255,${0.7 * pulse})`;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x, cy - cr * 1.4);
  ctx.lineTo(x + cr * 0.9, cy);
  ctx.lineTo(x, cy + cr * 1.4);
  ctx.lineTo(x - cr * 0.9, cy);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();

  // Light beam up
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const bg = ctx.createLinearGradient(0, cy - 200, 0, cy + 40);
  bg.addColorStop(0, 'rgba(200,120,255,0)');
  bg.addColorStop(1, `rgba(200,120,255,${0.18 * pulse})`);
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(x - 40, cy - 200);
  ctx.lineTo(x + 40, cy - 200);
  ctx.lineTo(x + 20, cy + 30);
  ctx.lineTo(x - 20, cy + 30);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ----------------------------- BREED SYNTHESIZER (left platform) ----------------------------- */
function drawBreedSynthesizer(t) {
  const p = platforms.left;
  ctx.save();
  ctx.translate(p.cx, p.cy - 6);

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, 20, 110, 26, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Base pad
  ctx.fillStyle = '#0d0a22';
  ctx.beginPath();
  ctx.ellipse(0, 14, 105, 26, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#1a1440';
  ctx.beginPath();
  ctx.ellipse(0, 10, 96, 22, 0, 0, Math.PI * 2);
  ctx.fill();

  // Two chamber pods
  const pods = [-52, 52];
  for (const px of pods) {
    // Pod shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(px, 16, 34, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Pod body (dome)
    const pg = ctx.createLinearGradient(px, -60, px, 20);
    pg.addColorStop(0, '#4a1f7a');
    pg.addColorStop(0.5, '#2a0f4a');
    pg.addColorStop(1, '#0d0520');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.moveTo(px - 32, 16);
    ctx.bezierCurveTo(px - 34, -30, px + 34, -30, px + 32, 16);
    ctx.closePath();
    ctx.fill();

    // Pod rim
    ctx.strokeStyle = 'rgba(180,120,255,0.6)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(px, 16, 32, 9, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Glass window glow
    const pulse = 0.7 + 0.3 * Math.sin(t * 1.7 + px * 0.02);
    ctx.save();
    ctx.shadowColor = '#c77dff';
    ctx.shadowBlur = 20 * pulse;
    const wg = ctx.createRadialGradient(px, -12, 2, px, -12, 24);
    wg.addColorStop(0, `rgba(230,180,255,${0.9 * pulse})`);
    wg.addColorStop(0.6, `rgba(150,80,220,${0.55 * pulse})`);
    wg.addColorStop(1, 'rgba(80,40,140,0)');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.ellipse(px, -12, 22, 26, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Little antenna tip
    ctx.strokeStyle = 'rgba(200,140,255,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px, -38);
    ctx.lineTo(px, -52);
    ctx.stroke();
    ctx.fillStyle = '#d4a2ff';
    ctx.beginPath();
    ctx.arc(px, -54, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Central column with glowing runes
  ctx.fillStyle = '#1a0f30';
  roundRect(-14, -78, 28, 94, 8);
  ctx.fill();

  ctx.strokeStyle = 'rgba(200,140,255,0.55)';
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 4; i++) {
    const ry = -66 + i * 22;
    ctx.beginPath();
    ctx.moveTo(-9, ry);
    ctx.lineTo(9, ry);
    ctx.stroke();
  }

  // Top orb
  const topPulse = 0.75 + 0.25 * Math.sin(t * 2.2);
  ctx.save();
  ctx.shadowColor = '#d090ff';
  ctx.shadowBlur = 24 * topPulse;
  const og = ctx.createRadialGradient(0, -92, 2, 0, -92, 18);
  og.addColorStop(0, `rgba(255,230,255,${0.95 * topPulse})`);
  og.addColorStop(1, 'rgba(180,100,255,0)');
  ctx.fillStyle = og;
  ctx.beginPath();
  ctx.arc(0, -92, 18, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = `rgba(255,240,255,${0.9 * topPulse})`;
  ctx.beginPath();
  ctx.arc(0, -92, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Connecting tubes from the central column to pods
  ctx.strokeStyle = 'rgba(150,90,220,0.55)';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-12, -60);
  ctx.quadraticCurveTo(-40, -55, -52, -38);
  ctx.moveTo(12, -60);
  ctx.quadraticCurveTo(40, -55, 52, -38);
  ctx.stroke();

  ctx.restore();

  // Floating label
  ctx.save();
  ctx.translate(p.cx, p.cy + 110);
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(220,180,255,0.85)';
  ctx.shadowColor = '#b44aff';
  ctx.shadowBlur = 8;
  ctx.fillText('◈ BREED SYNTHESIZER ◈', 0, 0);
  ctx.restore();
}

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#000';

  ctx.quadraticCurveTo(-64, -40, -30, -76);

  ctx.arc(-4, -50, 3.5 + sp * 1.5, 0, Math.PI * 2);

/* ----------------------------- ISLAND BASE ----------------------------- */
function drawIslandBase(t) {
  ctx.save();

  const baseGrad = ctx.createLinearGradient(0, 0, 0, BOT + 50);
  baseGrad.addColorStop(0.0, '#006688');
  baseGrad.addColorStop(0.4, '#0099bb');
  baseGrad.addColorStop(0.8, '#00ccff');
  baseGrad.addColorStop(1.0, '#00e5ff');

  ctx.fillStyle = baseGrad;
  ctx.beginPath();
  ctx.moveTo(-RX, 0);
  ctx.bezierCurveTo(-RX - 40, 120, -RX + 60, 250, -200, BOT - 40);
  ctx.bezierCurveTo(-100, BOT + 10, 100, BOT + 10, 200, BOT - 40);
  ctx.bezierCurveTo(RX - 60, 250, RX + 40, 120, RX, 0);
  ctx.closePath();
  ctx.fill();

  // Under shadow
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#003344';
  ctx.beginPath();
  ctx.moveTo(-RX + 50, 0);
  ctx.bezierCurveTo(-RX + 10, 120, -RX + 100, 240, -160, BOT - 10);
  ctx.bezierCurveTo(-80, BOT + 20, 80, BOT + 20, 160, BOT - 10);
  ctx.bezierCurveTo(RX - 100, 240, RX - 10, 120, RX - 50, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Glowing veins
  ctx.save();
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 15;
  ctx.strokeStyle = '#00ffff';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';

  const veins = [
    { x1: -300, y1: 150, cx: -200, cy: 220, x2: -150, y2: 300 },
    { x1:  280, y1: 120, cx:  220, cy: 200, x2:  180, y2: 280 },
    { x1: -100, y1: 280, cx:    0, cy: 320, x2:  120, y2: 290 },
    { x1: -420, y1: 100, cx: -380, cy: 160, x2: -350, y2: 200 },
    { x1:  400, y1:  90, cx:  360, cy: 150, x2:  340, y2: 220 },
  ];
  for (const v of veins) {
    ctx.beginPath();
    ctx.moveTo(v.x1, v.y1);
    ctx.quadraticCurveTo(v.cx, v.cy, v.x2, v.y2);
    ctx.stroke();
  }
  ctx.restore();

  // Glowing pools
  ctx.save();
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 25;
  const pools = [
    { x: -200, y: 260, w: 80, h: 50 },
    { x:  200, y: 260, w: 80, h: 50 },
    { x:    0, y: 300, w: 60, h: 40 },
    { x: -320, y: 160, w: 50, h: 30 },
    { x:  320, y: 160, w: 50, h: 30 },
  ];
  for (const p of pools) {
    const pg = ctx.createRadialGradient(p.x, p.y, 5, p.x, p.y, p.w);
    pg.addColorStop(0, 'rgba(180,255,255,0.85)');
    pg.addColorStop(0.5, 'rgba(0,200,255,0.55)');
    pg.addColorStop(1, 'rgba(0,100,150,0)');
    ctx.fillStyle = pg;
    roundRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h, 15);
    ctx.fill();
  }
  ctx.restore();

  ctx.restore();
}

/* ----------------------------- CRYSTAL RIM ----------------------------- */
function drawCrystalRim(t) {
  const BUMPS = 72;
  for (let i = 0; i < BUMPS; i++) {
    const a = (i / BUMPS) * Math.PI * 2 - Math.PI / 2;
    const bx = Math.cos(a) * RX;
    const by = Math.sin(a) * RY;
    const sizeMod = 0.5 + 0.5 * Math.abs(Math.sin(a));
    const size = (18 + Math.sin(i * 1.7) * 8 + Math.cos(i * 0.9) * 5) * sizeMod;
    const hue = 280 + 60 * Math.sin(a - Math.PI / 2);
    drawCrystalSpike(bx, by, a, size, hue, 0.9);
    if (i % 2 === 0) {
      drawCrystalSpike(bx * 1.05, by * 1.05, a + 0.2, size * 0.5, hue + 20, 0.7);
    }
  }
}

/* ----------------------------- VOID SURFACE ----------------------------- */
function drawVoidSurface(t) {
  ctx.save();

  const voidGrad = ctx.createRadialGradient(-50, -50, 20, 0, 0, GRX);
  voidGrad.addColorStop(0, '#1a0033');
  voidGrad.addColorStop(0.6, '#0d001a');
  voidGrad.addColorStop(1, '#05000a');

  ctx.fillStyle = voidGrad;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX, GRY, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowColor = '#b44aff';
  ctx.shadowBlur = 30;
  ctx.strokeStyle = 'rgba(180, 100, 255, 0.6)';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX - 4, GRY - 4, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255, 150, 255, 0.4)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX - 12, GRY - 12, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Surface swirls
  ctx.globalAlpha = 0.08;
  ctx.strokeStyle = '#cc88ff';
  ctx.lineWidth = 15;
  for (let i = 0; i < 5; i++) {
    const off = Math.sin(t * 0.3 + i) * 20;
    ctx.beginPath();
    ctx.ellipse(off, -10 + off * 0.5, GRX * 0.7, GRY * 0.7, t * 0.1 + i, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Floating crystals on surface
  const rnd = mulberry32(777);
  for (let i = 0; i < 10; i++) {
    const a = rnd() * Math.PI * 2;
    const r = Math.sqrt(rnd()) * 0.85;
    const px = Math.cos(a) * r * GRX;
    const py = Math.sin(a) * r * GRY - 10;
    // Skip crystals near the castle (back-center)
    if (Math.abs(px) < 200 && py < -40) continue;

    const bob = Math.sin(t * 1.5 + i) * 5;

    ctx.save();
    ctx.translate(px, py + bob);
    ctx.rotate(rnd() * Math.PI);

    ctx.fillStyle = `rgba(180, 100, 255, ${0.35 + rnd() * 0.4})`;
    ctx.shadowColor = '#b44aff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(8, 0);
    ctx.lineTo(0, 12);
    ctx.lineTo(-8, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

/* ----------------------------- FLOATING DEBRIS ----------------------------- */
const debris = (() => {
  const rnd = mulberry32(1234);
  const out = [];
  for (let i = 0; i < 36; i++) {
    const a = rnd() * Math.PI * 2;
    const r = 1.15 + rnd() * 0.75;
    out.push({
      a, r,
      size: 2 + rnd() * 6,
      spd: 0.1 + rnd() * 0.3,
      yOff: (rnd() - 0.5) * 420,
      hue: 260 + rnd() * 80,
      phase: rnd() * Math.PI * 2,
    });
  }
  return out;
})();

function drawDebris(t) {
  ctx.save();
  ctx.translate(W / 2 + state.cam.x, H * 0.45 + state.cam.y);

  for (const d of debris) {
    const angle = d.a + t * d.spd * 0.2;
    const dx = Math.cos(angle) * RX * d.r;
    const dy = Math.sin(angle) * RY * d.r + d.yOff + Math.sin(t * 0.5 + d.phase) * 20;
    if (dy < 0 && dx > -RX * 1.1 && dx < RX * 1.1) continue;

    ctx.save();
    ctx.translate(dx, dy);
    ctx.rotate(angle * 2);

    const alpha = 0.4 + 0.3 * Math.sin(t * 2 + d.phase);
    ctx.fillStyle = `hsla(${d.hue}, 80%, 70%, ${alpha})`;
    ctx.shadowColor = `hsla(${d.hue}, 100%, 60%, 0.8)`;
    ctx.shadowBlur = 12;

    ctx.beginPath();
    if (d.size > 4) {
      ctx.moveTo(0, -d.size);
      ctx.lineTo(d.size * 0.6, 0);
      ctx.lineTo(0, d.size);
      ctx.lineTo(-d.size * 0.6, 0);
      ctx.closePath();
    } else {
      ctx.arc(0, 0, d.size, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

/* ----------------------------- MAIN ISLAND DRAW ----------------------------- */
function drawIsland(t) {
  ctx.save();
  ctx.translate(W / 2 + state.cam.x, H * 0.45 + state.cam.y);

  // Drop shadow
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, BOT + 60, 350, 70, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ---- Draw order ----
  // 1. Platform bases (behind, at the sides)
  drawPlatformBase(platforms.left, t, 'left');
  drawPlatformBase(platforms.right, t, 'right');

  // 2. Bridges (behind the main island rim)
  drawBridge('left', t);
  drawBridge('right', t);

  // 3. Main island base
  drawIslandBase(t);

  // 4. Crystal rim
  drawCrystalRim(t);

  // 5. Void surface
  drawVoidSurface(t);

  // 6. Castle (on the void, at the back)
  drawCastle(t);

  // 7. Left: Breed Synthesizer
  drawBreedSynthesizer(t);

  // 8. Right: Incubation Center
  drawIncubationCenter(t);

  // Final rim highlight
  ctx.save();
  ctx.shadowColor = '#ff66ff';
  ctx.shadowBlur = 15;
  ctx.strokeStyle = 'rgba(255, 150, 255, 0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX, GRY, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  ctx.restore();
}

/* ------------------------------ VIGNETTE ------------------------------ */
function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3,
                                     W / 2, H / 2, Math.max(W, H) * 0.8);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(5,0,15,0.6)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ============================== LOOP ============================== */
function render(now) {
  const t = now / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  drawSky(t);
  drawIsland(t);
  drawDebris(t);
  drawVignette();

  requestAnimationFrame(render);
}

/* ============================ INTERACTION ============================ */
let isDragging = false, lastX = 0, lastY = 0;

/* ---- CAMERA LIMITS ---- */
const CAM_LIMITS = {
  zoomMin: 0.55,
  zoomMax: 2.0,
  panXFrac: 0.38,   // max pan X = W * panXFrac
  panYFrac: 0.28,   // max pan Y = H * panYFrac
};

function clampCamera() {
  const maxX = W * CAM_LIMITS.panXFrac;
  const maxY = H * CAM_LIMITS.panYFrac;
  state.cam.x = Math.max(-maxX, Math.min(maxX, state.cam.x));
  state.cam.y = Math.max(-maxY, Math.min(maxY, state.cam.y));
  state.cam.zoom = Math.max(CAM_LIMITS.zoomMin, Math.min(CAM_LIMITS.zoomMax, state.cam.zoom));
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  isDragging = true;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  state.cam.x += e.clientX - lastX;
  state.cam.y += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  clampCamera();
});
canvas.addEventListener('pointerup',    () => { isDragging = false; });
canvas.addEventListener('pointercancel',() => { isDragging = false; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const z  = state.cam.zoom;
  const nz = Math.max(CAM_LIMITS.zoomMin,
             Math.min(CAM_LIMITS.zoomMax, z * (e.deltaY > 0 ? 0.9 : 1.1)));

  const wx = (e.clientX - W / 2 - state.cam.x) / z;
  const wy = (e.clientY - H * 0.45 - state.cam.y) / z;
  state.cam.x = e.clientX - W / 2 - wx * nz;
  state.cam.y = e.clientY - H * 0.45 - wy * nz;
  state.cam.zoom = nz;

  clampCamera();
}, { passive: false });

/* ------------------------- INITIAL CAMERA FIT ------------------------- */
function fitCamera() {
  const zoomX = (W * 0.92) / 1500;   // wider to fit both platforms
  const zoomY = (H * 0.88) / 900;
  state.cam.zoom = Math.max(CAM_LIMITS.zoomMin,
                    Math.min(1.15, Math.min(zoomX, zoomY)));
  state.cam.x = 0;
  state.cam.y = 0;
  clampCamera();
}
fitCamera();

/* ------------------------------ GO! ------------------------------ */
requestAnimationFrame(render);
</script>
</body>
</html>

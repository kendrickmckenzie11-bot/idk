<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nyxara — The First Islet</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0b001a;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; user-select:none; }
  canvas { display:block; position:absolute; inset:0; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }

  #top {
    position:fixed; top:0; left:0; right:0; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; z-index:10; gap:16px;
  }
  #island-name {
    font-size:24px; font-weight:900; letter-spacing:1px; color:#fff;
    text-shadow:0 0 20px rgba(180,100,255,.8), 0 2px 0 rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.4);
    background:rgba(30,10,50,.6); padding:10px 22px; border-radius:999px;
    backdrop-filter:blur(10px); border:1px solid rgba(200,150,255,.3);
    white-space:nowrap;
  }
  #island-name small {
    display:block; font-size:11px; font-weight:700; letter-spacing:3px;
    color:#b89aff; text-transform:uppercase; margin-top:3px;
  }

  #hud-right { display:flex; gap:10px; pointer-events:auto; }
  .resource {
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(180deg, rgba(45,20,80,.85), rgba(20,8,40,.85));
    padding:6px 18px 6px 8px; border-radius:30px;
    border:1px solid rgba(180,120,255,.35);
    box-shadow:0 6px 24px rgba(120,60,220,.4), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(10px); min-width:128px;
  }
  .res-icon {
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; position:relative;
  }
  .res-icon.shard {
    background:radial-gradient(circle at 35% 30%, #ffe9a0, #f59e0b 55%, #92400e);
    box-shadow:0 0 14px rgba(255,180,60,.7), inset 0 -2px 4px rgba(0,0,0,.35);
  }
  .shard-shape {
    width:13px; height:15px;
    background:linear-gradient(135deg, #fff8dc, #ffca3a);
    clip-path:polygon(50% 0%, 100% 42%, 78% 100%, 22% 100%, 0% 42%);
    filter:drop-shadow(0 0 3px rgba(255,220,120,.9));
  }
  .res-icon.gem {
    background:radial-gradient(circle at 35% 30%, #e9d5ff, #a855f7 55%, #6b21a8);
    box-shadow:0 0 14px rgba(180,110,255,.85), inset 0 -2px 4px rgba(0,0,0,.4);
  }
  .gem-shape {
    width:15px; height:13px;
    background:linear-gradient(135deg, #f3e8ff, #c084fc, #7c3aed);
    clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    filter:drop-shadow(0 0 3px rgba(210,160,255,.9));
  }
  .res-info { display:flex; flex-direction:column; line-height:1.1; }
  .res-label {
    font-size:9px; font-weight:700; letter-spacing:1.5px;
    color:rgba(200,170,255,.72); text-transform:uppercase;
  }
  .res-value {
    font-size:16px; font-weight:900; color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
    font-variant-numeric:tabular-nums;
  }

  #hint {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    font-size:12px; color:rgba(220,200,255,.8); font-weight:600;
    background:rgba(10,0,25,.5); padding:8px 16px; border-radius:999px;
    backdrop-filter:blur(8px); border:1px solid rgba(180,120,255,.2);
    letter-spacing:.5px; pointer-events:none; z-index:10;
  }

  #audio-prompt {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(5,0,15,.55); backdrop-filter:blur(6px);
    z-index:50; cursor:pointer; transition:opacity .6s ease;
  }
  #audio-prompt.hide { opacity:0; pointer-events:none; }
  #audio-prompt .card {
    background:rgba(30,10,55,.9); border:1px solid rgba(200,150,255,.4);
    padding:32px 44px; border-radius:24px; text-align:center;
    box-shadow:0 0 60px rgba(180,100,255,.4);
  }
  #audio-prompt h2 { color:#fff; font-size:22px; font-weight:800; letter-spacing:1px; }
  #audio-prompt p { color:#b89aff; font-size:13px; margin-top:8px; letter-spacing:1px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top">
  <div id="island-name">🌌 Nyxara<small>The First Islet</small></div>
  <div id="hud-right">
    <div class="resource">
      <div class="res-icon shard"><div class="shard-shape"></div></div>
      <div class="res-info">
        <div class="res-label">Shards</div>
        <div class="res-value" id="shard-value">1,250</div>
      </div>
    </div>
    <div class="resource">
      <div class="res-icon gem"><div class="gem-shape"></div></div>
      <div class="res-info">
        <div class="res-label">Gems</div>
        <div class="res-value" id="gem-value">47</div>
      </div>
    </div>
  </div>
</div>

<div id="hint">Drag to pan • Scroll to zoom</div>

<div id="audio-prompt">
  <div class="card">
    <h2>Tap to Awaken the Castle</h2>
    <p>♫ The song of Nyxara begins ♫</p>
  </div>
</div>

<script>
/* =========================================================================
   NYXARA — Cosmic Islet with Castle
   Performance-focused, clean crystalline base.
   ========================================================================= */

/* ------------------------------ CANVAS ------------------------------ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let DPR = 1, W = 0, H = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  skyCache = null;   // invalidate sky cache
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------ STATE ------------------------------ */
const state = { cam: { x: 0, y: 0, zoom: 1 } };

/* --------------------------- HELPERS --------------------------- */
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* =========================================================================
   AUDIO — Castle deep bass drone
   ========================================================================= */
let audioCtx = null, castleGain = null, audioStarted = false;

function initAudio() {
  if (audioStarted) return;
  audioStarted = true;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  castleGain = audioCtx.createGain();
  castleGain.gain.value = 0.0;
  castleGain.connect(audioCtx.destination);

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 320;
  lp.Q.value = 0.8;
  lp.connect(castleGain);

  const lfoFilter = audioCtx.createOscillator();
  lfoFilter.frequency.value = 0.07;
  const lfoFilterGain = audioCtx.createGain();
  lfoFilterGain.gain.value = 90;
  lfoFilter.connect(lfoFilterGain);
  lfoFilterGain.connect(lp.frequency);
  lfoFilter.start();

  const lfoAmp = audioCtx.createOscillator();
  lfoAmp.frequency.value = 0.11;
  const lfoAmpGain = audioCtx.createGain();
  lfoAmpGain.gain.value = 0.25;
  lfoAmp.connect(lfoAmpGain);

  const notes = [
    { f: 27.5,  g: 0.35, type: 'sine'     },
    { f: 55.0,  g: 0.55, type: 'sine'     },
    { f: 82.4,  g: 0.30, type: 'triangle' },
    { f: 110.0, g: 0.18, type: 'sine'     },
    { f: 165.0, g: 0.10, type: 'triangle' },
  ];
  notes.forEach((n, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = n.type;
    osc.frequency.value = n.f;
    osc.detune.value = (i - 2) * 4;
    const g = audioCtx.createGain();
    g.gain.value = n.g;
    lfoAmpGain.connect(g.gain);
    osc.connect(g);
    g.connect(lp);
    osc.start();
  });
  lfoAmp.start();

  const now = audioCtx.currentTime;
  castleGain.gain.setValueAtTime(0.0001, now);
  castleGain.gain.linearRampToValueAtTime(0.55, now + 4.0);

  document.getElementById('audio-prompt').classList.add('hide');
}
document.getElementById('audio-prompt').addEventListener('click', initAudio);
canvas.addEventListener('pointerdown', initAudio, { once: true });

/* ======================== SKY (cached offscreen) ======================== */
let skyCache = null, skyCtx = null, skyFrameCounter = 0;

const stars = (() => {
  const rnd = mulberry32(42);
  const out = [];
  for (let i = 0; i < 180; i++) {
    out.push({
      x: rnd() * 2400 - 700, y: rnd() * 2400 - 700,
      r: 0.5 + rnd() * 2.0, a: 0.35 + rnd() * 0.65,
      tw: rnd() * Math.PI * 2, spd: 0.5 + rnd() * 2,
      col: rnd() > 0.85 ? '#aaddff' : (rnd() > 0.65 ? '#ffccff' : '#ffffff'),
    });
  }
  return out;
})();

const nebulae = [
  { x: 0.15, y: 0.25, r: 460, c1: 'rgba(255,0,150,0.14)', c2: 'rgba(255,0,150,0)' },
  { x: 0.85, y: 0.35, r: 540, c1: 'rgba(0,200,255,0.12)', c2: 'rgba(0,200,255,0)' },
  { x: 0.50, y: 0.80, r: 620, c1: 'rgba(150,0,255,0.12)', c2: 'rgba(150,0,255,0)' },
  { x: 0.22, y: 0.82, r: 420, c1: 'rgba(0,255,200,0.09)', c2: 'rgba(0,255,200,0)' },
];

function drawSky(t) {
  if (!skyCache || skyCache.width !== canvas.width || skyCache.height !== canvas.height) {
    skyCache = document.createElement('canvas');
    skyCache.width = canvas.width;
    skyCache.height = canvas.height;
    skyCtx = skyCache.getContext('2d');
    skyCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    skyFrameCounter = 0;
  }

  skyFrameCounter++;
  if (skyFrameCounter % 6 === 1) {
    const s = skyCtx;
    s.setTransform(DPR, 0, 0, DPR, 0, 0);
    s.clearRect(0, 0, W, H);

    // Deep space gradient
    const g = s.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0.0, '#05000a');
    g.addColorStop(0.3, '#0f0025');
    g.addColorStop(0.7, '#1a0035');
    g.addColorStop(1.0, '#0d001a');
    s.fillStyle = g;
    s.fillRect(0, 0, W, H);

    // Nebulae
    s.save();
    s.globalCompositeOperation = 'lighter';
    for (const n of nebulae) {
      const nx = n.x * W, ny = n.y * H;
      const rg = s.createRadialGradient(nx, ny, 10, nx, ny, n.r);
      rg.addColorStop(0, n.c1);
      rg.addColorStop(1, n.c2);
      s.fillStyle = rg;
      s.fillRect(nx - n.r, ny - n.r, n.r * 2, n.r * 2);
    }
    s.restore();

    // Stars
    for (const st of stars) {
      const sx = (st.x + W / 2) % (W + 1400) - 700;
      const sy = (st.y + H / 2) % (H + 1400) - 700;
      const twinkle = 0.7 + 0.3 * Math.sin(t * st.spd + st.tw);
      s.fillStyle = st.col;
      s.globalAlpha = st.a * twinkle;
      s.beginPath();
      s.arc(sx, sy, st.r, 0, Math.PI * 2);
      s.fill();
    }
    s.globalAlpha = 1;
  }

  ctx.drawImage(skyCache, 0, 0, W, H);
}

/* ======================== ISLAND GEOMETRY ======================== */
const RX  = 620;
const RY  = 310;
const GRX = 520;
const GRY = 240;
const BOT = 520;

/* ----------------------------- FAST CRYSTAL SPIKE ----------------------------- */
/* Same visual language as before, but WITHOUT shadowBlur — uses a cheap glow layer instead. */
function drawCrystalSpikeFast(x, y, angle, size, hue, alpha = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  const len = size * 2.3;
  const wid = size * 0.75;

  // Soft glow halo (larger, low alpha) — cheap replacement for shadowBlur
  ctx.fillStyle = `hsla(${hue}, 100%, 62%, ${alpha * 0.28})`;
  ctx.beginPath();
  ctx.moveTo(-len * 0.1, -wid * 1.5);
  ctx.lineTo(len * 1.15, 0);
  ctx.lineTo(-len * 0.1, wid * 1.5);
  ctx.closePath();
  ctx.fill();

  // Main body with gradient
  const grad = ctx.createLinearGradient(0, 0, len, 0);
  grad.addColorStop(0.0, `hsla(${hue}, 90%, 45%, ${alpha})`);
  grad.addColorStop(0.5, `hsla(${hue + 25}, 92%, 66%, ${alpha})`);
  grad.addColorStop(1.0, `hsla(${hue + 55}, 95%, 85%, ${alpha})`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, -wid);
  ctx.lineTo(len, 0);
  ctx.lineTo(0, wid);
  ctx.closePath();
  ctx.fill();

  // Inner highlight
  ctx.fillStyle = `hsla(${hue + 60}, 100%, 93%, ${alpha * 0.55})`;
  ctx.beginPath();
  ctx.moveTo(0, -wid * 0.35);
  ctx.lineTo(len * 0.78, 0);
  ctx.lineTo(0, 0);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

/* ---------------------- TALL BACK SPIKES ---------------------- */
function drawTallBackSpike(x, y, h, w, hue, pulse) {
  ctx.save();
  ctx.translate(x, y);

  // Ground shadow on the rim
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(0, 0, w * 0.85, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Soft glow halo (no shadowBlur)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(0, -h * 0.55, 5, 0, -h * 0.55, w * 2.4);
  halo.addColorStop(0, `hsla(${hue}, 95%, 62%, ${0.32 * pulse})`);
  halo.addColorStop(1, `hsla(${hue}, 95%, 62%, 0)`);
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.ellipse(0, -h * 0.5, w * 2.4, h * 0.75, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Main body
  const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  g.addColorStop(0.00, '#0a0016');
  g.addColorStop(0.30, `hsl(${hue}, 65%, 26%)`);
  g.addColorStop(0.60, `hsl(${hue}, 82%, 52%)`);
  g.addColorStop(1.00, '#0a0016');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-w / 2, 0);
  ctx.lineTo(-w * 0.18, -h * 0.62);
  ctx.lineTo(0, -h);
  ctx.lineTo(w * 0.18, -h * 0.62);
  ctx.lineTo(w / 2, 0);
  ctx.closePath();
  ctx.fill();

  // Bright lit edge
  ctx.strokeStyle = `hsla(${hue + 50}, 100%, 82%, ${0.9 * pulse})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -h);
  ctx.lineTo(w * 0.18, -h * 0.62);
  ctx.lineTo(w / 2, 0);
  ctx.stroke();

  // Bright tip
  ctx.fillStyle = `hsla(${hue + 60}, 100%, 95%, ${pulse})`;
  ctx.beginPath();
  ctx.arc(0, -h, 3 + pulse * 1.8, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawBackSpikes(t) {
  const N = 11;
  for (let i = 0; i < N; i++) {
    const u = (i / (N - 1)) * 2 - 1;
    const a = -Math.PI / 2 + u * 0.95;
    const bx = Math.cos(a) * (RX - 18);
    const by = Math.sin(a) * (RY - 18);

    if (Math.abs(u) < 0.14) continue;   // keep space for castle

    const hFactor = Math.cos(u * 1.15);
    const h = 90 + hFactor * 130;
    const w = 30 + hFactor * 18;
    const hue = 265 + hFactor * 40;
    const pulse = 0.65 + 0.35 * Math.sin(t * 1.3 + i * 0.9);

    drawTallBackSpike(bx, by, h, w, hue, pulse);
  }
}

/* ----------------------------- SIDE PLATFORMS (on void, near castle) ----------------------------- */
const platforms = {
  left:  { cx: -370, cy: -150, rx: 140, ry: 68 },
  right: { cx:  370, cy: -150, rx: 140, ry: 68 },
};

function drawPlatformBase(p) {
  // Shadow under platform
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(p.cx, p.cy + 22, p.rx * 0.95, p.ry * 0.75, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Base disc
  const g = ctx.createLinearGradient(0, p.cy - p.ry, 0, p.cy + p.ry + 40);
  g.addColorStop(0, '#0089aa');
  g.addColorStop(0.6, '#00b8d8');
  g.addColorStop(1, '#005a77');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(p.cx, p.cy, p.rx, p.ry, 0, 0, Math.PI * 2);
  ctx.fill();

  // Underside shading
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#00232e';
  ctx.beginPath();
  ctx.ellipse(p.cx, p.cy + 16, p.rx * 0.9, p.ry * 0.85, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Small crystal spikes around the platform edge (no shadowBlur)
  const BUMPS = 22;
  for (let i = 0; i < BUMPS; i++) {
    const a = (i / BUMPS) * Math.PI * 2;
    const bx = p.cx + Math.cos(a) * p.rx;
    const by = p.cy + Math.sin(a) * p.ry;
    const size = 8 + Math.sin(i * 1.9) * 3;
    const hue = 195 + Math.sin(a) * 40;
    drawCrystalSpikeFast(bx, by, a, size, hue, 0.85);
  }

  // Soft glowing core
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const pg = ctx.createRadialGradient(p.cx, p.cy - 4, 4, p.cx, p.cy - 4, p.rx * 0.85);
  pg.addColorStop(0, 'rgba(180,255,255,0.35)');
  pg.addColorStop(1, 'rgba(0,120,180,0)');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.ellipse(p.cx, p.cy - 4, p.rx * 0.85, p.ry * 0.85, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/* ----------------------------- CASTLE ----------------------------- */
const castle = { cx: 0, cy: -240, s: 0.82 };

function drawCastle(t) {
  const { cx, cy, s } = castle;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);

  const pulse = 0.85 + 0.15 * Math.sin(t * 1.4);

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, 34, 150, 34, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Obsidian base plate
  ctx.fillStyle = '#0d0018';
  ctx.beginPath();
  ctx.ellipse(0, 26, 148, 32, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a0033';
  ctx.beginPath();
  ctx.ellipse(0, 22, 140, 28, 0, 0, Math.PI * 2);
  ctx.fill();

  // Glowing rune ring
  ctx.save();
  ctx.shadowColor = '#b44aff';
  ctx.shadowBlur = 14 * pulse;
  ctx.strokeStyle = `rgba(200,120,255,${0.6 * pulse})`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(0, 22, 110, 20, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // Towers
  const towers = [
    { x: -78, h: 120, w: 44, hue: 280 },
    { x:  78, h: 120, w: 44, hue: 280 },
    { x: -42, h: 170, w: 38, hue: 300 },
    { x:  42, h: 170, w: 38, hue: 300 },
  ];
  for (const tw of towers) drawTower(tw.x, 26, tw.w, tw.h, tw.hue, t);

  drawMainSpire(0, 26, t, pulse);

  // Floating crystals
  for (let i = 0; i < 3; i++) {
    const a = t * 0.6 + i * (Math.PI * 2 / 3);
    const orbitX = Math.cos(a) * 90;
    const orbitY = -160 + Math.sin(a) * 18;
    const sz = 7 + Math.sin(t * 2 + i) * 2;
    ctx.save();
    ctx.translate(orbitX, orbitY);
    ctx.rotate(a);
    ctx.fillStyle = `hsla(${290 + i * 15}, 100%, 75%, 0.9)`;
    ctx.shadowColor = `hsla(${290 + i * 15}, 100%, 65%, 0.9)`;
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.moveTo(0, -sz);
    ctx.lineTo(sz * 0.6, 0);
    ctx.lineTo(0, sz);
    ctx.lineTo(-sz * 0.6, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Ground glow
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const gg = ctx.createRadialGradient(0, 26, 6, 0, 26, 220);
  gg.addColorStop(0, `rgba(180,90,255,${0.18 * pulse})`);
  gg.addColorStop(1, 'rgba(180,90,255,0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.ellipse(0, 26, 220, 60, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawTower(x, baseY, w, h, hue, t) {
  const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  g.addColorStop(0,   '#10001f');
  g.addColorStop(0.5, '#2a004a');
  g.addColorStop(1,   '#08001a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - w / 2, baseY);
  ctx.lineTo(x - w * 0.32, baseY - h);
  ctx.lineTo(x + w * 0.32, baseY - h);
  ctx.lineTo(x + w / 2, baseY);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(180,120,255,0.20)';
  ctx.beginPath();
  ctx.moveTo(x - w / 2, baseY);
  ctx.lineTo(x - w * 0.32, baseY - h);
  ctx.lineTo(x - w * 0.20, baseY - h);
  ctx.lineTo(x - w * 0.34, baseY);
  ctx.closePath();
  ctx.fill();

  const capSz = w * 0.42;
  const pulse = 0.8 + 0.2 * Math.sin(t * 2);
  ctx.save();
  ctx.shadowColor = `hsl(${hue}, 100%, 65%)`;
  ctx.shadowBlur = 18 * pulse;
  ctx.fillStyle = `hsl(${hue}, 90%, 70%)`;
  ctx.beginPath();
  ctx.moveTo(x, baseY - h - capSz * 1.8);
  ctx.lineTo(x + capSz, baseY - h);
  ctx.lineTo(x, baseY - h + capSz * 0.4);
  ctx.lineTo(x - capSz, baseY - h);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.shadowColor = `hsl(${hue}, 100%, 70%)`;
  ctx.shadowBlur = 10 * pulse;
  ctx.fillStyle = `hsla(${hue}, 100%, 78%, ${0.75 * pulse})`;
  roundRect(ctx, x - w * 0.14, baseY - h * 0.6, w * 0.28, h * 0.16, 4);
  ctx.fill();
  ctx.restore();
}

function drawMainSpire(x, baseY, t, pulse) {
  const H = 320;
  const W0 = 62;

  const g = ctx.createLinearGradient(x - W0 / 2, 0, x + W0 / 2, 0);
  g.addColorStop(0,   '#0d001a');
  g.addColorStop(0.4, '#2c0050');
  g.addColorStop(0.6, '#3a0066');
  g.addColorStop(1,   '#08001a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - W0 / 2, baseY);
  ctx.lineTo(x - W0 * 0.22, baseY - H * 0.72);
  ctx.lineTo(x + W0 * 0.22, baseY - H * 0.72);
  ctx.lineTo(x + W0 / 2, baseY);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(200,140,255,0.22)';
  ctx.beginPath();
  ctx.moveTo(x - W0 / 2, baseY);
  ctx.lineTo(x - W0 * 0.22, baseY - H * 0.72);
  ctx.lineTo(x - W0 * 0.10, baseY - H * 0.72);
  ctx.lineTo(x - W0 * 0.28, baseY);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = `rgba(200,130,255,${0.35 + 0.3 * pulse})`;
  ctx.lineWidth = 2;
  for (let i = 1; i <= 5; i++) {
    const ry = baseY - H * 0.72 * (i / 6);
    const rw = W0 * 0.5 * (1 - i * 0.12);
    ctx.beginPath();
    ctx.moveTo(x - rw, ry);
    ctx.lineTo(x + rw, ry);
    ctx.stroke();
  }

  ctx.save();
  ctx.shadowColor = '#c87aff';
  ctx.shadowBlur = 14 * pulse;
  ctx.fillStyle = `rgba(230,180,255,${0.85 * pulse})`;
  for (let i = 0; i < 3; i++) {
    const wy = baseY - H * 0.18 - i * 60;
    roundRect(ctx, x - 7, wy - 10, 14, 22, 4);
    ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle = '#1a0033';
  ctx.beginPath();
  ctx.moveTo(x - W0 * 0.22, baseY - H * 0.72);
  ctx.lineTo(x - 8, baseY - H * 0.95);
  ctx.lineTo(x + 8, baseY - H * 0.95);
  ctx.lineTo(x + W0 * 0.22, baseY - H * 0.72);
  ctx.closePath();
  ctx.fill();

  const cy = baseY - H * 0.95 - 40;
  const cr = 30;
  ctx.save();
  ctx.shadowColor = '#d090ff';
  ctx.shadowBlur = 30 * pulse;
  const cg = ctx.createRadialGradient(x, cy, 4, x, cy, cr);
  cg.addColorStop(0, `rgba(255,220,255,${0.95 * pulse})`);
  cg.addColorStop(0.5, `rgba(210,120,255,${0.75 * pulse})`);
  cg.addColorStop(1, 'rgba(140,60,200,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(x, cy, cr, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = `rgba(255,240,255,${0.9 * pulse})`;
  ctx.beginPath();
  ctx.arc(x, cy, cr * 0.32, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = `rgba(230,180,255,${0.7 * pulse})`;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x, cy - cr * 1.4);
  ctx.lineTo(x + cr * 0.9, cy);
  ctx.lineTo(x, cy + cr * 1.4);
  ctx.lineTo(x - cr * 0.9, cy);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const bg = ctx.createLinearGradient(0, cy - 200, 0, cy + 40);
  bg.addColorStop(0, 'rgba(200,120,255,0)');
  bg.addColorStop(1, `rgba(200,120,255,${0.18 * pulse})`);
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(x - 40, cy - 200);
  ctx.lineTo(x + 40, cy - 200);
  ctx.lineTo(x + 20, cy + 30);
  ctx.lineTo(x - 20, cy + 30);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ----------------------------- BREED SYNTHESIZER ----------------------------- */
function drawBreedSynthesizer(t) {
  const p = platforms.left;
  ctx.save();
  ctx.translate(p.cx, p.cy - 6);
  ctx.scale(0.85, 0.85);   // scale down to fit smaller platform

  // Pods
  const pods = [-52, 52];
  for (const px of pods) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(px, 16, 34, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    const pg = ctx.createLinearGradient(px, -60, px, 20);
    pg.addColorStop(0, '#4a1f7a');
    pg.addColorStop(0.5, '#2a0f4a');
    pg.addColorStop(1, '#0d0520');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.moveTo(px - 32, 16);
    ctx.bezierCurveTo(px - 34, -30, px + 34, -30, px + 32, 16);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(180,120,255,0.6)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(px, 16, 32, 9, 0, 0, Math.PI * 2);
    ctx.stroke();

    const pulse = 0.7 + 0.3 * Math.sin(t * 1.7 + px * 0.02);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const wg = ctx.createRadialGradient(px, -12, 2, px, -12, 24);
    wg.addColorStop(0, `rgba(230,180,255,${0.9 * pulse})`);
    wg.addColorStop(0.6, `rgba(150,80,220,${0.55 * pulse})`);
    wg.addColorStop(1, 'rgba(80,40,140,0)');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.ellipse(px, -12, 22, 26, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(200,140,255,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px, -38);
    ctx.lineTo(px, -52);
    ctx.stroke();
    ctx.fillStyle = '#d4a2ff';
    ctx.beginPath();
    ctx.arc(px, -54, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Central column
  ctx.fillStyle = '#1a0f30';
  roundRect(ctx, -14, -78, 28, 94, 8);
  ctx.fill();

  ctx.strokeStyle = 'rgba(200,140,255,0.55)';
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 4; i++) {
    const ry = -66 + i * 22;
    ctx.beginPath();
    ctx.moveTo(-9, ry);
    ctx.lineTo(9, ry);
    ctx.stroke();
  }

  // Top orb
  const topPulse = 0.75 + 0.25 * Math.sin(t * 2.2);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const og = ctx.createRadialGradient(0, -92, 2, 0, -92, 24);
  og.addColorStop(0, `rgba(255,230,255,${0.95 * topPulse})`);
  og.addColorStop(1, 'rgba(180,100,255,0)');
  ctx.fillStyle = og;
  ctx.beginPath();
  ctx.arc(0, -92, 24, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = `rgba(255,240,255,${0.9 * topPulse})`;
  ctx.beginPath();
  ctx.arc(0, -92, 5, 0, Math.PI * 2);
  ctx.fill();

  // Connecting tubes
  ctx.strokeStyle = 'rgba(150,90,220,0.55)';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-12, -60);
  ctx.quadraticCurveTo(-40, -55, -52, -38);
  ctx.moveTo(12, -60);
  ctx.quadraticCurveTo(40, -55, 52, -38);
  ctx.stroke();

  ctx.restore();

  // Label
  ctx.save();
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(220,180,255,0.85)';
  ctx.shadowColor = '#b44aff';
  ctx.shadowBlur = 8;
  ctx.fillText('◈ BREED SYNTHESIZER ◈', p.cx, p.cy + 70);
  ctx.restore();
}

  const p = platforms.right;

}

/* =====================================================
   ISLAND BASE — completely redesigned bottom
   ===================================================== */
function drawIslandBase(t) {
  // Build path as Path2D so we can reuse it for fill + clip + stroke
  const path = new Path2D();
  path.moveTo(-RX, 0);
  path.bezierCurveTo(-RX - 30, 200, -RX + 80, 420, -180, BOT - 30);
  path.bezierCurveTo(-60, BOT + 25, 60, BOT + 25, 180, BOT - 30);
  path.bezierCurveTo(RX - 80, 420, RX + 30, 200, RX, 0);
  path.closePath();

  // ---- 1. Main gradient body ----
  const g = ctx.createLinearGradient(0, -50, 0, BOT + 30);
  g.addColorStop(0.00, '#0a3a5c');
  g.addColorStop(0.22, '#0e6083');
  g.addColorStop(0.50, '#0aa8c5');
  g.addColorStop(0.82, '#00d6ea');
  g.addColorStop(1.00, '#0098b5');
  ctx.fillStyle = g;
  ctx.fill(path);

  // ---- 2. Details clipped to the base ----
  ctx.save();
  ctx.clip(path);

  // 2a. Soft vertical facets — alternating light/shadow columns
  for (let x = -RX - 60, i = 0; x < RX + 60; x += 90, i++) {
    if (i % 2 === 1) {
      ctx.fillStyle = 'rgba(0,20,45,0.14)';
      ctx.fillRect(x, 0, 45, BOT + 60);
    } else {
      ctx.fillStyle = 'rgba(140,240,255,0.06)';
      ctx.fillRect(x, 0, 45, BOT + 60);
    }
  }

  // 2b. Subtle horizontal strata
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = '#000';
  for (let i = 0; i < 2; i++) {
    const y = 200 + i * 140;
    ctx.beginPath();
    ctx.moveTo(-RX, y);
    for (let x = -RX; x <= RX; x += 30) {
      ctx.lineTo(x, y + Math.sin(x * 0.005 + i * 1.7) * 6);
    }
    ctx.lineTo(RX, y + 22);
    for (let x = RX; x >= -RX; x -= 30) {
      ctx.lineTo(x, y + 22 + Math.sin(x * 0.005 + i * 1.7) * 6);
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 2c. Glowing window portals (clean, symmetric layout)
  const windows = [
    { x: -250, y: 240, w: 130, h: 82 },
    { x:  250, y: 240, w: 130, h: 82 },
    { x:  -70, y: 370, w: 100, h: 62 },
    { x:   70, y: 370, w: 100, h: 62 },
  ];
  for (const w of windows) {
    // Outer glow
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const og = ctx.createRadialGradient(w.x, w.y, 4, w.x, w.y, w.w * 0.95);
    og.addColorStop(0, 'rgba(200,250,255,0.55)');
    og.addColorStop(0.4, 'rgba(60,220,255,0.28)');
    og.addColorStop(1, 'rgba(0,150,200,0)');
    ctx.fillStyle = og;
    roundRect(ctx, w.x - w.w / 2, w.y - w.h / 2, w.w, w.h, 24);
    ctx.fill();
    ctx.restore();

    // Inner bright
    const ig = ctx.createRadialGradient(w.x, w.y - 6, 3, w.x, w.y, w.w * 0.4);
    ig.addColorStop(0, 'rgba(255,255,255,0.95)');
    ig.addColorStop(0.6, 'rgba(140,235,255,0.55)');
    ig.addColorStop(1, 'rgba(80,200,255,0)');
    ctx.fillStyle = ig;
    ctx.beginPath();
    ctx.ellipse(w.x, w.y - 6, w.w * 0.34, w.h * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();

    // Rim line
    ctx.strokeStyle = 'rgba(180,250,255,0.65)';
    ctx.lineWidth = 2;
    roundRect(ctx, w.x - w.w / 2, w.y - w.h / 2, w.w, w.h, 24);
    ctx.stroke();
  }

  // 2d. Thin vertical glowing seams connecting the windows
  ctx.strokeStyle = 'rgba(140,240,255,0.22)';
  ctx.lineWidth = 1.5;
  for (const w of windows) {
    ctx.beginPath();
    ctx.moveTo(w.x, w.y + w.h / 2 + 4);
    ctx.lineTo(w.x, BOT - 30);
    ctx.stroke();
  }

  ctx.restore(); // end clip

  // ---- 3. Bottom tip glow ----
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const bg = ctx.createRadialGradient(0, BOT - 40, 20, 0, BOT - 40, 400);
  bg.addColorStop(0, 'rgba(140,245,255,0.4)');
  bg.addColorStop(0.55, 'rgba(60,200,255,0.12)');
  bg.addColorStop(1, 'rgba(60,200,255,0)');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(0, BOT - 40, 400, 95, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ---- 4. Bright rim edge ----
  ctx.strokeStyle = 'rgba(160,245,255,0.5)';
  ctx.lineWidth = 3;
  ctx.stroke(path);
}

/* ----------------------------- CRYSTAL RIM (top half only) ----------------------------- */
function drawCrystalRim(t) {
  const BUMPS = 40;
  for (let i = 0; i < BUMPS; i++) {
    const a = (i / BUMPS) * Math.PI * 2 - Math.PI / 2;

    // Skip crystals on the front / bottom of the rim so the base reads clean
    if (Math.sin(a) > 0.35) continue;

    const bx = Math.cos(a) * RX;
    const by = Math.sin(a) * RY;

    // Taller at the back, shorter toward the sides
    const centerBias = Math.max(0, -Math.sin(a));
    const sizeMod = 0.55 + 0.75 * centerBias;
    const size = (16 + Math.sin(i * 1.7) * 6) * sizeMod;

    const hue = 280 + 60 * centerBias;
    drawCrystalSpikeFast(bx, by, a, size, hue, 0.9);
  }
}

/* ----------------------------- VOID SURFACE ----------------------------- */
function drawVoidSurface(t) {
  ctx.save();

  // Deep void gradient
  const voidGrad = ctx.createRadialGradient(-50, -50, 20, 0, 0, GRX);
  voidGrad.addColorStop(0, '#1a0033');
  voidGrad.addColorStop(0.6, '#0d001a');
  voidGrad.addColorStop(1, '#05000a');
  ctx.fillStyle = voidGrad;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX, GRY, 0, 0, Math.PI * 2);
  ctx.fill();

  // Rim glow rings (three strokes, NO shadowBlur)
  ctx.strokeStyle = 'rgba(140, 80, 220, 0.16)';
  ctx.lineWidth = 40;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX - 4, GRY - 4, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(180, 100, 255, 0.42)';
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX - 4, GRY - 4, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(225, 165, 255, 0.75)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX - 4, GRY - 4, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Subtle void swirls
  ctx.globalAlpha = 0.07;
  ctx.strokeStyle = '#cc88ff';
  ctx.lineWidth = 14;
  for (let i = 0; i < 4; i++) {
    const off = Math.sin(t * 0.3 + i) * 20;
    ctx.beginPath();
    ctx.ellipse(off, -10 + off * 0.5, GRX * 0.72, GRY * 0.72, t * 0.1 + i, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Small floating crystals on the void surface
  const rnd = mulberry32(777);
  for (let i = 0; i < 5; i++) {
    const a = rnd() * Math.PI * 2;
    const r = Math.sqrt(rnd()) * 0.7;
    const px = Math.cos(a) * r * GRX;
    const py = Math.sin(a) * r * GRY - 10;
    if (Math.abs(px) < 260 && py < -60) continue;

    const bob = Math.sin(t * 1.5 + i) * 4;

    ctx.save();
    ctx.translate(px, py + bob);
    ctx.rotate(rnd() * Math.PI);
    ctx.fillStyle = 'rgba(200, 130, 255, 0.75)';
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(7, 0);
    ctx.lineTo(0, 10);
    ctx.lineTo(-7, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 220, 255, 0.6)';
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.lineTo(3, 0);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

/* ----------------------------- FLOATING DEBRIS ----------------------------- */
const debris = (() => {
  const rnd = mulberry32(1234);
  const out = [];
  for (let i = 0; i < 20; i++) {
    const a = rnd() * Math.PI * 2;
    const r = 1.1 + rnd() * 0.55;
    out.push({
      a, r,
      size: 2 + rnd() * 5,
      spd: 0.1 + rnd() * 0.3,
      yOff: (rnd() - 0.5) * 380,
      hue: 260 + rnd() * 80,
      phase: rnd() * Math.PI * 2,
    });
  }
  return out;
})();

function drawDebris(t) {
  ctx.save();
  ctx.translate(W / 2 + state.cam.x, H * 0.45 + state.cam.y);

  for (const d of debris) {
    const angle = d.a + t * d.spd * 0.2;
    const dx = Math.cos(angle) * RX * d.r;
    const dy = Math.sin(angle) * RY * d.r + d.yOff + Math.sin(t * 0.5 + d.phase) * 18;
    if (dy < 0 && dx > -RX * 1.05 && dx < RX * 1.05) continue;

    const alpha = 0.55 + 0.4 * Math.sin(t * 2 + d.phase);
    ctx.fillStyle = `hsla(${d.hue}, 85%, 72%, ${alpha})`;

    if (d.size > 4) {
      ctx.save();
      ctx.translate(dx, dy);
      ctx.rotate(angle * 2);
      ctx.beginPath();
      ctx.moveTo(0, -d.size);
      ctx.lineTo(d.size * 0.55, 0);
      ctx.lineTo(0, d.size);
      ctx.lineTo(-d.size * 0.55, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(dx, dy, d.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

/* ----------------------------- MAIN ISLAND DRAW ----------------------------- */
function drawIsland(t) {
  ctx.save();
  ctx.translate(W / 2 + state.cam.x, H * 0.45 + state.cam.y);

  // Ground shadow
  ctx.save();
  ctx.globalAlpha = 0.14;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, BOT + 60, 400, 75, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Back to front
  drawIslandBase(t);
  drawCrystalRim(t);
  drawVoidSurface(t);
  drawBackSpikes(t);
  drawCastle(t);
  drawPlatformBase(platforms.left);
  drawPlatformBase(platforms.right);
  drawBreedSynthesizer(t);
  drawIncubationCenter(t);

  // Final rim accent
  ctx.strokeStyle = 'rgba(255, 150, 255, 0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX, GRY, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

/* ------------------------------ VIGNETTE ------------------------------ */
function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3,
                                     W / 2, H / 2, Math.max(W, H) * 0.8);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(5,0,15,0.6)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ============================== LOOP ============================== */
function render(now) {
  const t = now / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  drawSky(t);
  drawIsland(t);
  drawDebris(t);
  drawVignette();

  requestAnimationFrame(render);
}

/* ============================ INTERACTION ============================ */
let isDragging = false, lastX = 0, lastY = 0;

const CAM_LIMITS = {
  zoomMin: 0.45,
  zoomMax: 2.0,
  panXFrac: 0.45,
  panYFrac: 0.35,
};

function clampCamera() {
  const maxX = W * CAM_LIMITS.panXFrac;
  const maxY = H * CAM_LIMITS.panYFrac;
  state.cam.x = Math.max(-maxX, Math.min(maxX, state.cam.x));
  state.cam.y = Math.max(-maxY, Math.min(maxY, state.cam.y));
  state.cam.zoom = Math.max(CAM_LIMITS.zoomMin, Math.min(CAM_LIMITS.zoomMax, state.cam.zoom));
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  isDragging = true;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  state.cam.x += e.clientX - lastX;
  state.cam.y += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  clampCamera();
});
canvas.addEventListener('pointerup',    () => { isDragging = false; });
canvas.addEventListener('pointercancel',() => { isDragging = false; });

/* Smooth cursor-pivoted zoom */
const ZOOM_STEP = 0.08;

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const dir = e.deltaY > 0 ? -1 : 1;
  const z = state.cam.zoom;
  const nz = Math.max(CAM_LIMITS.zoomMin,
             Math.min(CAM_LIMITS.zoomMax, z * (1 + dir * ZOOM_STEP)));
  if (Math.abs(nz - z) < 1e-4) return;

  const px = e.clientX;
  const py = e.clientY;
  const wx = (px - W / 2 - state.cam.x) / z;
  const wy = (py - H * 0.45 - state.cam.y) / z;

  state.cam.zoom = nz;
  state.cam.x = px - W / 2 - wx * nz;
  state.cam.y = py - H * 0.45 - wy * nz;

  clampCamera();
}, { passive: false });

/* ------------------------- INITIAL CAMERA FIT ------------------------- */
function fitCamera() {
  // Scene bounding box ≈ 1240 wide × 1180 tall
  const zoomX = (W * 0.92) / 1240;
  const zoomY = (H * 0.90) / 1180;
  state.cam.zoom = Math.max(CAM_LIMITS.zoomMin,
                    Math.min(1.05, Math.min(zoomX, zoomY)));
  state.cam.x = 0;
  state.cam.y = 0;
  clampCamera();
}
fitCamera();

/* ------------------------------ GO! ------------------------------ */
requestAnimationFrame(render);
</script>
</body>
</html>

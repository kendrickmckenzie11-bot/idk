<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseplate</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #9ab8d8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; }

  #crosshair {
    position: fixed; left: 50%; top: 50%;
    width: 4px; height: 4px; margin: -2px 0 0 -2px;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    box-shadow: 0 0 4px rgba(0,0,0,.7);
    pointer-events: none;
    opacity: 0; transition: opacity .25s ease;
  }
  #crosshair.show { opacity: 1; }

  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(10, 18, 30, .55);
    backdrop-filter: blur(4px);
    color: #fff; text-align: center; cursor: pointer;
    user-select: none; transition: opacity .3s ease;
    text-shadow: 0 2px 20px rgba(0,0,0,.6);
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: .3px; }
  #overlay .play { font-size: 17px; font-weight: 600; opacity: .95; }
  #overlay .keys { font-size: 13px; opacity: .72; line-height: 2.3; }
  kbd {
    background: rgba(255,255,255,.13);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 5px; padding: 2px 7px;
    font-family: inherit; font-size: 12px;
  }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0c1420; color: #c8d8e8;
    font-size: 14px; letter-spacing: .1em; text-transform: uppercase;
    transition: opacity .5s ease; z-index: 100;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .err {
    color: #ff8888; text-transform: none; letter-spacing: 0;
    font-size: 12px; max-width: 70vw; text-align: center;
    margin-top: 12px;
  }
  #hud {
    position: fixed; top: 10px; left: 12px;
    color: rgba(255,255,255,.55); font-size: 11px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
    pointer-events: none; user-select: none;
    letter-spacing: .05em;
  }
</style>
</head>
<body>

<div id="loading">Building world…</div>
<div id="hud"></div>
<div id="crosshair"></div>

<div id="overlay">
  <h1>Baseplate</h1>
  <div class="play">Click to play</div>
  <div class="keys">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp;·&nbsp;
    <kbd>Mouse</kbd> look &nbsp;·&nbsp;
    <kbd>Space</kbd> jump &nbsp;·&nbsp;
    <kbd>Shift</kbd> run &nbsp;·&nbsp;
    <kbd>Esc</kbd> release
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* ===================================================================== */
/*  Tunables                                                             */
/* ===================================================================== */
const EYE_HEIGHT = 1.70;
const WALK_SPEED = 3.4;
const RUN_SPEED  = 6.8;
const GRAVITY    = 24.0;
const JUMP_SPEED = 7.0;

// Sun: 25° elevation, 135° azimuth
const SUN_ELEV = 25 * Math.PI / 180;
const SUN_AZIM = 135 * Math.PI / 180;
const SUN_DIR = new THREE.Vector3(
  Math.cos(SUN_ELEV) * Math.sin(SUN_AZIM),
  Math.sin(SUN_ELEV),
  Math.cos(SUN_ELEV) * Math.cos(SUN_AZIM)
).normalize();

const UP = new THREE.Vector3(0, 1, 0);

/* ===================================================================== */
/*  State                                                                */
/* ===================================================================== */
let scene, camera, renderer, controls, sky;
let ready = false;

const clock  = new THREE.Clock();
const keys   = Object.create(null);
const clouds = [];
const cloudGroup = new THREE.Group();

const player = {
  pos: new THREE.Vector3(0, EYE_HEIGHT, 0),
  vel: new THREE.Vector3(),
  grounded: true,
  bobPhase: 0,
  bobBlend: 0
};

const forward = new THREE.Vector3();
const right   = new THREE.Vector3();
const wish    = new THREE.Vector3();

let fpsAccum = 0, fpsFrames = 0;
const hud = document.getElementById('hud');

/* ===================================================================== */
/*  Boot                                                                 */
/* ===================================================================== */
try {
  init();
  ready = true;
  hideLoading();
} catch (err) {
  console.error('Init failed:', err);
  showError(err);
}
if (ready) animate();

function hideLoading() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('loading').classList.add('hidden');
  }));
}
function showError(err) {
  const el = document.getElementById('loading');
  el.innerHTML = '';
  const msg = document.createElement('div');
  msg.textContent = 'Failed to start';
  const detail = document.createElement('div');
  detail.className = 'err';
  detail.textContent = String(err && err.message ? err.message : err);
  el.appendChild(msg);
  el.appendChild(detail);
}

/* ===================================================================== */
/*  Init                                                                 */
/* ===================================================================== */
function init() {
  /* ---------- renderer (with MSAA, no post-processing) ---------- */
  renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance',
    stencil: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.body.appendChild(renderer.domElement);

  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  /* ---------- scene ---------- */
  scene = new THREE.Scene();
  // Fog matches the horizon colour exactly so the ground fades into the sky.
  scene.fog = new THREE.FogExp2(0xc7d7e6, 0.00035);

  /* ---------- camera ---------- */
  camera = new THREE.PerspectiveCamera(
    72, window.innerWidth / window.innerHeight, 0.1, 30000
  );
  camera.position.copy(player.pos);

  /* ---------- lights ---------- */
  scene.add(new THREE.HemisphereLight(0xbdd6f2, 0x5a5750, 1.35));

  const sun = new THREE.DirectionalLight(0xfff1d8, 2.7);
  sun.position.copy(SUN_DIR).multiplyScalar(500);
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0xc8d8ee, 0.22);
  fill.position.copy(SUN_DIR).multiplyScalar(-500);
  scene.add(fill);

  /* ---------- ground ---------- */
  const { albedoTex, normalTex, roughTex } = generateConcreteTextures(512, maxAniso);
  const GROUND_SIZE = 20000;
  const TILE = 20;
  const reps = GROUND_SIZE / TILE;

  albedoTex.repeat.set(reps, reps);
  normalTex.repeat.set(reps, reps);
  roughTex.repeat.set(reps, reps);

  const groundGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 1, 1);
  groundGeo.rotateX(-Math.PI / 2);

  const groundMat = new THREE.MeshStandardMaterial({
    map: albedoTex,
    normalMap: normalTex,
    normalScale: new THREE.Vector2(0.7, 0.7),
    roughnessMap: roughTex,
    roughness: 1.0,
    metalness: 0.0,
    dithering: true
  });

  scene.add(new THREE.Mesh(groundGeo, groundMat));

  /* ---------- sky dome (gradient only — cheap) ---------- */
  sky = makeSky();
  scene.add(sky);

  /* ---------- clouds (sprites — cheap) ---------- */
  scene.add(cloudGroup);
  buildClouds(maxAniso);

  /* ---------- controls ---------- */
  controls = new PointerLockControls(camera, renderer.domElement);

  const overlay   = document.getElementById('overlay');
  const crosshair = document.getElementById('crosshair');

  overlay.addEventListener('click', () => controls.lock());
  controls.addEventListener('lock', () => {
    overlay.classList.add('hidden');
    crosshair.classList.add('show');
  });
  controls.addEventListener('unlock', () => {
    overlay.classList.remove('hidden');
    crosshair.classList.remove('show');
    player.vel.x = 0;
    player.vel.z = 0;
  });

  /* ---------- input ---------- */
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  /* ---------- resize ---------- */
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

/* ===================================================================== */
/*  Sky — analytic gradient + sun disc + Mie glow (no clouds in shader)  */
/* ===================================================================== */
function makeSky() {
  // Low segment count: gradient doesn't need geometry detail.
  const geo = new THREE.SphereGeometry(14000, 24, 16);

  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      uSunDir: { value: SUN_DIR.clone() }
    },
    vertexShader: /* glsl */`
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform vec3 uSunDir;
      varying vec3 vWorldPos;

      void main() {
        vec3 rayDir = normalize(vWorldPos - cameraPosition);
        vec3 sunDir = normalize(uSunDir);
        float sunDot = dot(rayDir, sunDir);
        float h = max(rayDir.y, 0.0);

        // three-stop vertical gradient
        vec3 zenith  = vec3(0.055, 0.175, 0.520);
        vec3 mid     = vec3(0.240, 0.480, 0.830);
        vec3 horizon = vec3(0.700, 0.800, 0.900);

        vec3 sky;
        if (h < 0.22) {
          sky = mix(horizon, mid, smoothstep(0.0, 0.22, h));
        } else {
          sky = mix(mid, zenith, pow(smoothstep(0.22, 1.0, h), 0.85));
        }

        // Mie-ish glow around the sun
        float mu = max(sunDot, 0.0);
        sky += vec3(1.00, 0.93, 0.78) * pow(mu, 6.0)   * 0.30;
        sky += vec3(1.00, 0.96, 0.88) * pow(mu, 64.0)  * 0.55;
        sky += vec3(1.00, 0.98, 0.94) * pow(mu, 500.0) * 1.20;

        // sun disc
        float disc = smoothstep(0.99975, 0.99990, sunDot);
        sky += vec3(1.0, 0.97, 0.92) * disc * 20.0;

        // haze below the horizon so nothing black shows through
        if (rayDir.y < 0.0) {
          float gt = clamp(-rayDir.y * 5.0, 0.0, 1.0);
          sky = mix(horizon * 1.02, vec3(0.52, 0.53, 0.55), gt);
        }

        gl_FragColor = vec4(sky, 1.0);
      }
    `
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = -1000;
  return mesh;
}

/* ===================================================================== */
/*  Cloud sprites                                                        */
/* ===================================================================== */
function buildClouds(maxAniso) {
  // Bake ~8 distinct cloud textures up front, then reuse them.
  const texRng = mulberry32(0xC10D);
  const textures = [];
  for (let i = 0; i < 8; i++) textures.push(makeCloudTexture(texRng, 512, maxAniso));

  const rng = mulberry32(0xBEEF);

  // Three atmospheric layers, each with its own character.
  // [minDist, maxDist, minY, maxY, minScale, maxScale, count, baseOpacity]
  const layers = [
    // low, small, crisp cumulus
    [ 280, 900,  220, 380, 130, 260, 16, 0.72],
    // mid cumulus — the "hero" layer
    [ 700, 2000, 380, 700, 260, 520, 22, 0.68],
    // high, large, hazy cirrus
    [1400, 4200, 700, 1300, 500, 1100, 14, 0.50]
  ];

  for (const [minD, maxD, minY, maxY, minS, maxS, count, baseOpacity] of layers) {
    for (let i = 0; i < count; i++) {
      const tex = textures[(rng() * textures.length) | 0];

      const mat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        depthTest: true,
        fog: true,
        opacity: baseOpacity * (0.85 + rng() * 0.30)
      });

      const sprite = new THREE.Sprite(mat);

      const ang = rng() * Math.PI * 2;
      const rad = minD + rng() * (maxD - minD);
      const y   = minY + rng() * (maxY - minY);
      const w   = minS + rng() * (maxS - minS);

      sprite.scale.set(w, w * 0.5, 1);      // textures are 2:1
      sprite.position.set(Math.cos(ang) * rad, y, Math.sin(ang) * rad);
      sprite.userData.speed = 2.5 + rng() * 4.5;   // m/s drift

      cloudGroup.add(sprite);
      clouds.push(sprite);
    }
  }
}

/* Draws a fluffy cumulus cloud into a canvas and returns it as a texture. */
function makeCloudTexture(rand, size, maxAniso) {
  const W = size;
  const H = Math.round(size * 0.5);
  const cvs = document.createElement('canvas');
  cvs.width = W;
  cvs.height = H;
  const ctx = cvs.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  // ---- 1. Silhouette: lots of soft radial puffs along a horizontal band ----
  const puffCount = 26 + Math.floor(rand() * 12);
  for (let i = 0; i < puffCount; i++) {
    const t = i / (puffCount - 1);
    const bell = Math.sin(t * Math.PI);                 // 0 → 1 → 0

    const x = W * 0.10 + t * W * 0.80 + (rand() - 0.5) * W * 0.05;
    const r = W * (0.045 + 0.095 * bell * (0.55 + rand() * 0.85));
    const y = H * 0.66
            - bell * H * 0.26 * (0.5 + rand() * 0.9)
            - rand() * H * 0.05;

    const g = ctx.createRadialGradient(x, y, r * 0.05, x, y, r);
    g.addColorStop(0.00, 'rgba(255,255,255,1)');
    g.addColorStop(0.40, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.72, 'rgba(255,255,255,0.42)');
    g.addColorStop(1.00, 'rgba(255,255,255,0)');

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- 2. Restrict subsequent passes to the cloud silhouette ----
  ctx.globalCompositeOperation = 'source-atop';

  // Sunlit top: warm white highlight
  const topLight = ctx.createLinearGradient(0, H * 0.08, 0, H * 0.55);
  topLight.addColorStop(0.00, 'rgba(255, 252, 240, 0.55)');
  topLight.addColorStop(1.00, 'rgba(255, 252, 240, 0.00)');
  ctx.fillStyle = topLight;
  ctx.fillRect(0, 0, W, H);

  // Shadowed base: cool grey-blue (simulates ambient sky + self-shadow)
  const baseShadow = ctx.createLinearGradient(0, H * 0.35, 0, H * 0.85);
  baseShadow.addColorStop(0.00, 'rgba(190, 204, 224, 0.00)');
  baseShadow.addColorStop(0.50, 'rgba(170, 188, 214, 0.42)');
  baseShadow.addColorStop(1.00, 'rgba(130, 152, 186, 0.85)');
  ctx.fillStyle = baseShadow;
  ctx.fillRect(0, 0, W, H);

  // ---- 3. Soft internal detail (breaks up the smooth blobs) ----
  ctx.globalCompositeOperation = 'source-atop';
  ctx.globalAlpha = 0.10;
  for (let i = 0; i < 40; i++) {
    const x = rand() * W;
    const y = H * 0.35 + rand() * H * 0.5;
    const r = 8 + rand() * 26;
    const dark = rand() < 0.55;
    ctx.fillStyle = dark ? 'rgba(120,140,170,1)' : 'rgba(255,255,255,1)';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- 4. Silver lining: bright rim along the top edges ----
  ctx.globalCompositeOperation = 'source-atop';
  const rim = ctx.createLinearGradient(0, H * 0.10, 0, H * 0.42);
  rim.addColorStop(0.00, 'rgba(255, 255, 255, 0.00)');
  rim.addColorStop(0.55, 'rgba(255, 253, 245, 0.55)');
  rim.addColorStop(1.00, 'rgba(255, 255, 255, 0.00)');
  ctx.fillStyle = rim;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'source-over';

  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = maxAniso;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true;
  return tex;
}

/* ===================================================================== */
/*  Procedural concrete textures                                         */
/* ===================================================================== */
function generateConcreteTextures(size, maxAniso) {
  function hash2(ix, iy) {
    let h = (ix * 374761393 + iy * 668265263) | 0;
    h = ((h ^ (h >>> 13)) * 1274126177) | 0;
    h = (h ^ (h >>> 16)) >>> 0;
    return h / 4294967295;
  }
  function vnoise(x, y, period) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const x0 = ((xi % period) + period) % period;
    const y0 = ((yi % period) + period) % period;
    const x1 = (x0 + 1) % period;
    const y1 = (y0 + 1) % period;
    const a = hash2(x0, y0), b = hash2(x1, y0);
    const c = hash2(x0, y1), d = hash2(x1, y1);
    return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
  }
  function fbm(u, v, baseFreq, octaves) {
    let val = 0, amp = 0.5, freq = baseFreq;
    for (let i = 0; i < octaves; i++) {
      val += amp * vnoise(u * freq, v * freq, freq);
      freq *= 2;
      amp *= 0.5;
    }
    return val;
  }

  const height = new Float32Array(size * size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      let h = fbm(u, v, 10, 5);
      h += fbm(u, v, 90, 2) * 0.06;
      h += (Math.random() - 0.5) * 0.025;
      height[y * size + x] = h;
    }
  }

  // Albedo
  const albedoCv = document.createElement('canvas');
  albedoCv.width = albedoCv.height = size;
  const actx = albedoCv.getContext('2d');
  const albedoImg = actx.createImageData(size, size);
  const ad = albedoImg.data;

  for (let i = 0, p = 0; i < size * size; i++, p += 4) {
    const h = height[i];
    const base = 0.46 + (h - 0.5) * 0.30;
    const n1 = (Math.random() - 0.5) * 0.030;
    const n2 = (Math.random() - 0.5) * 0.026;
    const n3 = (Math.random() - 0.5) * 0.022;
    ad[p    ] = Math.max(0, Math.min(255, (base + n1) * 255));
    ad[p + 1] = Math.max(0, Math.min(255, (base + n2) * 255));
    ad[p + 2] = Math.max(0, Math.min(255, (base * 1.015 + n3) * 255));
    ad[p + 3] = 255;
  }
  actx.putImageData(albedoImg, 0, 0);

  // Normal
  const normalCv = document.createElement('canvas');
  normalCv.width = normalCv.height = size;
  const nctx = normalCv.getContext('2d');
  const normalImg = nctx.createImageData(size, size);
  const nd = normalImg.data;
  const strength = 5.5;

  for (let y = 0; y < size; y++) {
    const y0 = (y - 1 + size) % size;
    const y1 = (y + 1) % size;
    for (let x = 0; x < size; x++) {
      const x0 = (x - 1 + size) % size;
      const x1 = (x + 1) % size;
      const hL = height[y  * size + x0];
      const hR = height[y  * size + x1];
      const hD = height[y0 * size + x ];
      const hU = height[y1 * size + x ];
      const dx = (hR - hL) * strength;
      const dy = (hU - hD) * strength;
      const len = Math.sqrt(dx*dx + dy*dy + 1.0);
      const i = (y * size + x) * 4;
      nd[i    ] = ((-dx / len) * 0.5 + 0.5) * 255;
      nd[i + 1] = ((-dy / len) * 0.5 + 0.5) * 255;
      nd[i + 2] = (( 1.0 / len) * 0.5 + 0.5) * 255;
      nd[i + 3] = 255;
    }
  }
  nctx.putImageData(normalImg, 0, 0);

  // Roughness
  const roughCv = document.createElement('canvas');
  roughCv.width = roughCv.height = size;
  const rctx = roughCv.getContext('2d');
  const roughImg = rctx.createImageData(size, size);
  const rd = roughImg.data;

  for (let i = 0, p = 0; i < size * size; i++, p += 4) {
    const h = height[i];
    let r = 0.88 + (h - 0.5) * 0.14;
    r = Math.max(0.6, Math.min(1.0, r));
    const v = r * 255;
    rd[p] = rd[p + 1] = rd[p + 2] = v;
    rd[p + 3] = 255;
  }
  rctx.putImageData(roughImg, 0, 0);

  const albedoTex = new THREE.CanvasTexture(albedoCv);
  albedoTex.colorSpace = THREE.SRGBColorSpace;
  albedoTex.wrapS = albedoTex.wrapT = THREE.RepeatWrapping;
  albedoTex.anisotropy = maxAniso;

  const normalTex = new THREE.CanvasTexture(normalCv);
  normalTex.wrapS = normalTex.wrapT = THREE.RepeatWrapping;
  normalTex.anisotropy = maxAniso;

  const roughTex = new THREE.CanvasTexture(roughCv);
  roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;
  roughTex.anisotropy = maxAniso;

  return { albedoTex, normalTex, roughTex };
}

/* ===================================================================== */
/*  Main loop                                                            */
/* ===================================================================== */
function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);
  const active = controls.isLocked;

  updatePlayer(delta, active);

  // Sky stays centred on the eye
  sky.position.copy(camera.position);

  // Cloud drift + horizontal wrap so the sky never empties out
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    c.position.x += c.userData.speed * delta;
    if (c.position.x > 5200) c.position.x = -5200;
  }
  cloudGroup.position.set(camera.position.x, 0, camera.position.z);

  renderer.render(scene, camera);

  // FPS readout
  fpsAccum += delta; fpsFrames++;
  if (fpsAccum >= 0.5) {
    hud.textContent = Math.round(fpsFrames / fpsAccum) + ' FPS';
    fpsAccum = 0; fpsFrames = 0;
  }
}

/* ===================================================================== */
/*  Player movement                                                      */
/* ===================================================================== */
function updatePlayer(delta, active) {
  camera.getWorldDirection(forward);
  forward.y = 0;
  if (forward.lengthSq() < 1e-8) forward.set(0, 0, -1);
  forward.normalize();
  right.crossVectors(forward, UP).normalize();

  const mz = active ? (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0) : 0;
  const mx = active ? (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0) : 0;

  wish.set(0, 0, 0)
      .addScaledVector(forward, mz)
      .addScaledVector(right, mx);
  if (wish.lengthSq() > 0) wish.normalize();

  const running = active && (keys['ShiftLeft'] || keys['ShiftRight']);
  const targetSpeed = running ? RUN_SPEED : WALK_SPEED;

  const accel = player.grounded ? 13 : 3;
  player.vel.x = THREE.MathUtils.damp(player.vel.x, wish.x * targetSpeed, accel, delta);
  player.vel.z = THREE.MathUtils.damp(player.vel.z, wish.z * targetSpeed, accel, delta);

  player.pos.x += player.vel.x * delta;
  player.pos.z += player.vel.z * delta;

  player.vel.y -= GRAVITY * delta;
  player.pos.y += player.vel.y * delta;

  if (player.pos.y <= EYE_HEIGHT) {
    player.pos.y = EYE_HEIGHT;
    player.vel.y = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  if (active && keys['Space'] && player.grounded) {
    player.vel.y = JUMP_SPEED;
    player.grounded = false;
  }

  const hSpeed = Math.hypot(player.vel.x, player.vel.z);
  const wantBob = (player.grounded && hSpeed > 0.35) ? 1 : 0;
  player.bobBlend = THREE.MathUtils.damp(player.bobBlend, wantBob, 6, delta);
  player.bobPhase += delta * (4.4 + hSpeed * 0.85);

  const bobY = Math.sin(player.bobPhase * 2) * 0.032 * player.bobBlend;
  const sway = Math.cos(player.bobPhase)     * 0.022 * player.bobBlend;

  camera.position.copy(player.pos);
  camera.position.x += right.x * sway;
  camera.position.z += right.z * sway;
  camera.position.y += bobY;

  const targetFov = 72 + (running && hSpeed > 4.2 ? 5.0 : 0.0);
  if (Math.abs(camera.fov - targetFov) > 0.02) {
    camera.fov = THREE.MathUtils.damp(camera.fov, targetFov, 5, delta);
    camera.updateProjectionMatrix();
  }
}

/* ===================================================================== */
/*  Seeded RNG                                                           */
/* ===================================================================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realistic Baseplate</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #9ab8d8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; }

  #crosshair {
    position: fixed; left: 50%; top: 50%;
    width: 4px; height: 4px; margin: -2px 0 0 -2px;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    box-shadow: 0 0 4px rgba(0,0,0,.7);
    pointer-events: none;
    opacity: 0; transition: opacity .25s ease;
  }
  #crosshair.show { opacity: 1; }

  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(10, 18, 30, .55);
    backdrop-filter: blur(4px);
    color: #fff; text-align: center; cursor: pointer;
    user-select: none; transition: opacity .3s ease;
    text-shadow: 0 2px 20px rgba(0,0,0,.6);
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: .3px; }
  #overlay .play { font-size: 17px; font-weight: 600; opacity: .95; }
  #overlay .keys { font-size: 13px; opacity: .72; line-height: 2.3; }
  kbd {
    background: rgba(255,255,255,.13);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 5px; padding: 2px 7px;
    font-family: inherit; font-size: 12px;
  }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0c1420; color: #c8d8e8;
    font-size: 14px; letter-spacing: .1em; text-transform: uppercase;
    transition: opacity .5s ease; z-index: 100;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .err {
    color: #ff8888; text-transform: none; letter-spacing: 0;
    font-size: 12px; max-width: 70vw; text-align: center;
    margin-top: 12px;
  }
</style>
</head>
<body>

<div id="loading">Building sky…</div>
<div id="crosshair"></div>

<div id="overlay">
  <h1>Baseplate</h1>
  <div class="play">Click to play</div>
  <div class="keys">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp;·&nbsp;
    <kbd>Mouse</kbd> look &nbsp;·&nbsp;
    <kbd>Space</kbd> jump &nbsp;·&nbsp;
    <kbd>Shift</kbd> run &nbsp;·&nbsp;
    <kbd>Esc</kbd> release
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { EffectComposer }     from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }         from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }    from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }         from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass }           from 'three/addons/postprocessing/SMAAPass.js';

/* ===================================================================== */
/*  Tunables                                                             */
/* ===================================================================== */
const EYE_HEIGHT = 1.70;
const WALK_SPEED = 3.4;
const RUN_SPEED  = 6.8;
const GRAVITY    = 24.0;
const JUMP_SPEED = 7.0;

const CLOUD_BOTTOM = 620.0;
const CLOUD_TOP    = 1420.0;

const SUN_ELEV = 25 * Math.PI / 180;
const SUN_AZIM = 135 * Math.PI / 180;
const SUN_DIR = new THREE.Vector3(
  Math.cos(SUN_ELEV) * Math.sin(SUN_AZIM),
  Math.sin(SUN_ELEV),
  Math.cos(SUN_ELEV) * Math.cos(SUN_AZIM)
).normalize();

const UP = new THREE.Vector3(0, 1, 0);

/* ===================================================================== */
/*  State                                                                */
/* ===================================================================== */
let scene, camera, renderer, composer, controls, sky, skyUniforms;
let ready = false;

const clock = new THREE.Clock();
const keys  = Object.create(null);

const player = {
  pos: new THREE.Vector3(0, EYE_HEIGHT, 0),
  vel: new THREE.Vector3(),
  grounded: true,
  bobPhase: 0,
  bobBlend: 0
};

const forward = new THREE.Vector3();
const right   = new THREE.Vector3();
const wish    = new THREE.Vector3();

/* ===================================================================== */
/*  Boot                                                                 */
/* ===================================================================== */
try {
  init();
  ready = true;
  hideLoading();
} catch (err) {
  console.error('Init failed:', err);
  showError(err);
}

if (ready) animate();

/* ===================================================================== */
/*  Loading helpers                                                      */
/* ===================================================================== */
function hideLoading() {
  // Wait one frame so the first render lands before we fade out.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.getElementById('loading').classList.add('hidden');
    });
  });
}
function showError(err) {
  const el = document.getElementById('loading');
  el.innerHTML = '';
  const msg = document.createElement('div');
  msg.textContent = 'Failed to start';
  const detail = document.createElement('div');
  detail.className = 'err';
  detail.textContent = String(err && err.message ? err.message : err);
  el.appendChild(msg);
  el.appendChild(detail);
}

/* ===================================================================== */
/*  Init                                                                 */
/* ===================================================================== */
function init() {
  /* ---------- renderer ---------- */
  renderer = new THREE.WebGLRenderer({
    antialias: false,                  // handled by SMAA pass
    powerPreference: 'high-performance',
    stencil: false
  });
  const pixelRatio = Math.min(window.devicePixelRatio, 1.75);
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  /* ---------- scene ---------- */
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xc4d6e8, 0.00022);

  /* ---------- camera ---------- */
  camera = new THREE.PerspectiveCamera(
    72, window.innerWidth / window.innerHeight, 0.1, 20000
  );
  camera.position.copy(player.pos);

  /* ---------- lights ---------- */
  const hemi = new THREE.HemisphereLight(0xbdd6f2, 0x5a5750, 1.4);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff1d8, 2.6);
  sun.position.copy(SUN_DIR).multiplyScalar(800);
  sun.target.position.set(0, 0, 0);
  scene.add(sun);
  scene.add(sun.target);

  const fill = new THREE.DirectionalLight(0xc8d8ee, 0.25);
  fill.position.copy(SUN_DIR).multiplyScalar(-800);
  scene.add(fill);

  /* ---------- ground ---------- */
  const { albedoTex, normalTex, roughTex } = generateConcreteTextures(1024, maxAniso);
  const GROUND_SIZE = 20000;
  const TILE = 22;
  const reps = GROUND_SIZE / TILE;

  albedoTex.repeat.set(reps, reps);
  normalTex.repeat.set(reps, reps);
  roughTex.repeat.set(reps, reps);

  const groundGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 1, 1);
  groundGeo.rotateX(-Math.PI / 2);

  const groundMat = new THREE.MeshStandardMaterial({
    map: albedoTex,
    normalMap: normalTex,
    normalScale: new THREE.Vector2(0.9, 0.9),
    roughnessMap: roughTex,
    roughness: 1.0,
    metalness: 0.0,
    envMapIntensity: 1.0,
    dithering: true
  });

  const ground = new THREE.Mesh(groundGeo, groundMat);
  scene.add(ground);

  /* ---------- sky ---------- */
  sky = makeSky();
  scene.add(sky);

  /* ---------- controls ---------- */
  controls = new PointerLockControls(camera, renderer.domElement);

  const overlay   = document.getElementById('overlay');
  const crosshair = document.getElementById('crosshair');

  overlay.addEventListener('click', () => controls.lock());

  controls.addEventListener('lock', () => {
    overlay.classList.add('hidden');
    crosshair.classList.add('show');
  });
  controls.addEventListener('unlock', () => {
    overlay.classList.remove('hidden');
    crosshair.classList.remove('show');
    player.vel.x = 0;
    player.vel.z = 0;
  });

  /* ---------- input ---------- */
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  /* ---------- post-processing ---------- */
  composer = new EffectComposer(renderer);
  composer.setPixelRatio(pixelRatio);
  composer.setSize(window.innerWidth, window.innerHeight);

  composer.addPass(new RenderPass(scene, camera));

  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.32,   // strength
    0.55,   // radius
    0.92    // threshold
  );
  composer.addPass(bloom);

  composer.addPass(new OutputPass());

  // SMAA takes *pixel* dimensions. Use the renderer's pixel ratio, not
  // composer.getPixelRatio() (which does not exist).
  composer.addPass(new SMAAPass(
    Math.floor(window.innerWidth  * pixelRatio),
    Math.floor(window.innerHeight * pixelRatio)
  ));

  /* ---------- resize ---------- */
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });
}

/* ===================================================================== */
/*  Sky dome — analytic atmosphere + raymarched volumetric clouds        */
/* ===================================================================== */
function makeSky() {
  const geo = new THREE.SphereGeometry(9000, 64, 40);

  skyUniforms = {
    uSunDir: { value: SUN_DIR.clone() },
    uTime:   { value: 0 }
  };

  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: skyUniforms,
    vertexShader: /* glsl */`
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;

      uniform vec3  uSunDir;
      uniform float uTime;

      varying vec3 vWorldPos;

      const float PI = 3.14159265359;

      /* ---------------- Hashes & noise ---------------- */
      float hash13(vec3 p3) {
        p3 = fract(p3 * 0.1031);
        p3 += dot(p3, p3.zyx + 31.32);
        return fract((p3.x + p3.y) * p3.z);
      }

      float vnoise(vec3 x) {
        vec3 i = floor(x);
        vec3 f = fract(x);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(mix(hash13(i + vec3(0,0,0)), hash13(i + vec3(1,0,0)), f.x),
              mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y),
          mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x),
              mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y),
          f.z);
      }

      float billowFbm(vec3 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 4; i++) {
          float n = vnoise(p);
          n = 1.0 - abs(2.0 * n - 1.0);
          v += a * n;
          p *= 2.07;
          a *= 0.5;
        }
        return v;
      }

      float detailFbm(vec3 p) {
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 3; i++) {
          v += a * vnoise(p);
          p *= 2.13;
          a *= 0.5;
        }
        return v;
      }

      /* ---------------- Phase ---------------- */
      float hg(float cosT, float g) {
        float g2 = g * g;
        return (1.0 - g2) /
               (4.0 * PI * pow(max(0.0, 1.0 - 2.0 * g * cosT + g2), 1.5));
      }

      /* ---------------- Sky gradient ---------------- */
      vec3 skyColor(vec3 rayDir, vec3 sunDir) {
        float sunDot = dot(rayDir, sunDir);
        float h = max(rayDir.y, 0.0);

        vec3 zenith  = vec3(0.055, 0.175, 0.520);
        vec3 mid     = vec3(0.240, 0.480, 0.830);
        vec3 horizon = vec3(0.660, 0.780, 0.900);

        vec3 sky;
        if (h < 0.22) {
          sky = mix(horizon, mid, smoothstep(0.0, 0.22, h));
        } else {
          sky = mix(mid, zenith, pow(smoothstep(0.22, 1.0, h), 0.85));
        }

        float mu = max(sunDot, 0.0);
        sky += vec3(1.00, 0.93, 0.78) * pow(mu, 6.0)   * 0.30;
        sky += vec3(1.00, 0.96, 0.88) * pow(mu, 64.0)  * 0.55;
        sky += vec3(1.00, 0.98, 0.94) * pow(mu, 500.0) * 1.20;

        float disc = smoothstep(0.99978, 0.99992, sunDot);
        sky += vec3(1.0, 0.97, 0.92) * disc * 24.0;

        if (rayDir.y < 0.0) {
          float gt = clamp(-rayDir.y * 5.0, 0.0, 1.0);
          sky = mix(horizon * 1.02, vec3(0.52, 0.53, 0.55), gt);
        }
        return sky;
      }

      /* ---------------- Cloud density ---------------- */
      float cloudDensity(vec3 p) {
        float h = (p.y - ${CLOUD_BOTTOM.toFixed(1)}) /
                  (${CLOUD_TOP.toFixed(1)} - ${CLOUD_BOTTOM.toFixed(1)});
        if (h < 0.0 || h > 1.0) return 0.0;

        float profile = smoothstep(0.0, 0.14, h) *
                        smoothstep(1.0, 0.62, h);
        if (profile <= 0.0) return 0.0;

        vec3 wind = vec3(uTime * 4.5, 0.0, uTime * 1.6);
        vec3 q = (p + wind) * 0.00072;

        float base = billowFbm(q);
        float det  = detailFbm(q * 6.5) * 0.22;

        float d = base * 0.85 + det - 0.52;
        d = max(d, 0.0) * 2.2;

        return d * profile;
      }

      float lightMarch(vec3 pos, vec3 sunDir) {
        float acc = 0.0;
        float step = 140.0;
        vec3 p = pos;
        for (int i = 0; i < 4; i++) {
          p += sunDir * step;
          acc += cloudDensity(p) * step;
        }
        return acc;
      }

      /* ---------------- Cloud raymarch ---------------- */
      vec4 raymarchClouds(vec3 ro, vec3 rd, vec3 sunDir) {
        if (rd.y < 0.008) return vec4(0.0);

        float t0 = (${CLOUD_BOTTOM.toFixed(1)} - ro.y) / rd.y;
        float t1 = (${CLOUD_TOP.toFixed(1)}    - ro.y) / rd.y;
        t0 = max(t0, 0.0);
        if (t1 <= t0) return vec4(0.0);

        const int STEPS = 44;
        float span = t1 - t0;
        float stepSize = span / float(STEPS);

        float dither = (hash13(vec3(gl_FragCoord.xy, uTime * 60.0)) - 0.5) * stepSize;
        vec3 pos = ro + rd * (t0 + dither);

        float transmittance = 1.0;
        vec3  scattered = vec3(0.0);

        float cosT = dot(rd, sunDir);
        float phase = hg(cosT, 0.52);

        vec3 sunColor = vec3(1.00, 0.96, 0.90);
        vec3 skyAmb   = vec3(0.42, 0.55, 0.74);

        const float EXT = 0.0021;

        for (int i = 0; i < STEPS; i++) {
          float dens = cloudDensity(pos);
          if (dens > 0.002) {
            float lightDens = lightMarch(pos, sunDir);
            float lightTrans = exp(-lightDens * EXT);

            float sunBoost = 1.0 + 2.5 * pow(max(cosT, 0.0), 12.0);

            vec3 S = sunColor * lightTrans * phase * 3.2 * sunBoost
                   + skyAmb * 0.14;

            float ext = dens * stepSize * EXT;
            float a = 1.0 - exp(-ext);

            scattered += transmittance * S * a;
            transmittance *= exp(-ext);

            if (transmittance < 0.012) break;
          }
          pos += rd * stepSize;
        }

        return vec4(scattered, 1.0 - transmittance);
      }

      /* ---------------- Main ---------------- */
      void main() {
        vec3 rayDir = normalize(vWorldPos - cameraPosition);
        vec3 sunDir = normalize(uSunDir);

        vec3 sky = skyColor(rayDir, sunDir);

        vec4 clouds = vec4(0.0);
        if (rayDir.y > 0.005) {
          clouds = raymarchClouds(cameraPosition, rayDir, sunDir);
        }

        vec3 col = mix(sky, clouds.rgb, clamp(clouds.a, 0.0, 1.0));

        gl_FragColor = vec4(col, 1.0);
      }
    `
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = -1000;
  return mesh;
}

/* ===================================================================== */
/*  Procedural concrete textures                                         */
/* ===================================================================== */
function generateConcreteTextures(size, maxAniso) {
  function hash2(ix, iy) {
    let h = (ix * 374761393 + iy * 668265263) | 0;
    h = ((h ^ (h >>> 13)) * 1274126177) | 0;
    h = (h ^ (h >>> 16)) >>> 0;
    return h / 4294967295;
  }
  function vnoise(x, y, period) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const x0 = ((xi % period) + period) % period;
    const y0 = ((yi % period) + period) % period;
    const x1 = (x0 + 1) % period;
    const y1 = (y0 + 1) % period;
    const a = hash2(x0, y0), b = hash2(x1, y0);
    const c = hash2(x0, y1), d = hash2(x1, y1);
    return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
  }
  function fbm(u, v, baseFreq, octaves) {
    let val = 0, amp = 0.5, freq = baseFreq;
    for (let i = 0; i < octaves; i++) {
      val += amp * vnoise(u * freq, v * freq, freq);
      freq *= 2;
      amp *= 0.5;
    }
    return val;
  }

  const height = new Float32Array(size * size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      let h = fbm(u, v, 10, 6);
      h += fbm(u, v, 90, 3) * 0.06;
      h += (Math.random() - 0.5) * 0.025;
      height[y * size + x] = h;
    }
  }

  // Albedo
  const albedoCv = document.createElement('canvas');
  albedoCv.width = albedoCv.height = size;
  const actx = albedoCv.getContext('2d');
  const albedoImg = actx.createImageData(size, size);
  const ad = albedoImg.data;

  for (let i = 0, p = 0; i < size * size; i++, p += 4) {
    const h = height[i];
    const base = 0.46 + (h - 0.5) * 0.30;
    const n1 = (Math.random() - 0.5) * 0.030;
    const n2 = (Math.random() - 0.5) * 0.026;
    const n3 = (Math.random() - 0.5) * 0.022;
    ad[p    ] = Math.max(0, Math.min(255, (base + n1) * 255));
    ad[p + 1] = Math.max(0, Math.min(255, (base + n2) * 255));
    ad[p + 2] = Math.max(0, Math.min(255, (base * 1.015 + n3) * 255));
    ad[p + 3] = 255;
  }
  actx.putImageData(albedoImg, 0, 0);

  // Normal
  const normalCv = document.createElement('canvas');
  normalCv.width = normalCv.height = size;
  const nctx = normalCv.getContext('2d');
  const normalImg = nctx.createImageData(size, size);
  const nd = normalImg.data;
  const strength = 6.5;

  for (let y = 0; y < size; y++) {
    const y0 = (y - 1 + size) % size;
    const y1 = (y + 1) % size;
    for (let x = 0; x < size; x++) {
      const x0 = (x - 1 + size) % size;
      const x1 = (x + 1) % size;
      const hL = height[y  * size + x0];
      const hR = height[y  * size + x1];
      const hD = height[y0 * size + x ];
      const hU = height[y1 * size + x ];
      const dx = (hR - hL) * strength;
      const dy = (hU - hD) * strength;
      const len = Math.sqrt(dx*dx + dy*dy + 1.0);
      const i = (y * size + x) * 4;
      nd[i    ] = ((-dx / len) * 0.5 + 0.5) * 255;
      nd[i + 1] = ((-dy / len) * 0.5 + 0.5) * 255;
      nd[i + 2] = (( 1.0 / len) * 0.5 + 0.5) * 255;
      nd[i + 3] = 255;
    }
  }
  nctx.putImageData(normalImg, 0, 0);

  // Roughness
  const roughCv = document.createElement('canvas');
  roughCv.width = roughCv.height = size;
  const rctx = roughCv.getContext('2d');
  const roughImg = rctx.createImageData(size, size);
  const rd = roughImg.data;

  for (let i = 0, p = 0; i < size * size; i++, p += 4) {
    const h = height[i];
    let r = 0.88 + (h - 0.5) * 0.14;
    r = Math.max(0.6, Math.min(1.0, r));
    const v = r * 255;
    rd[p] = rd[p + 1] = rd[p + 2] = v;
    rd[p + 3] = 255;
  }
  rctx.putImageData(roughImg, 0, 0);

  const albedoTex = new THREE.CanvasTexture(albedoCv);
  albedoTex.colorSpace = THREE.SRGBColorSpace;
  albedoTex.wrapS = albedoTex.wrapT = THREE.RepeatWrapping;
  albedoTex.anisotropy = maxAniso;

  const normalTex = new THREE.CanvasTexture(normalCv);
  normalTex.wrapS = normalTex.wrapT = THREE.RepeatWrapping;
  normalTex.anisotropy = maxAniso;

  const roughTex = new THREE.CanvasTexture(roughCv);
  roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;
  roughTex.anisotropy = maxAniso;

  return { albedoTex, normalTex, roughTex };
}

/* ===================================================================== */
/*  Main loop                                                            */
/* ===================================================================== */
function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);
  const active = controls.isLocked;

  skyUniforms.uTime.value += delta;

  updatePlayer(delta, active);

  sky.position.copy(camera.position);

  composer.render();
}

/* ===================================================================== */
/*  Player movement                                                      */
/* ===================================================================== */
function updatePlayer(delta, active) {
  camera.getWorldDirection(forward);
  forward.y = 0;
  if (forward.lengthSq() < 1e-8) forward.set(0, 0, -1);
  forward.normalize();
  right.crossVectors(forward, UP).normalize();

  const mz = active ? (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0) : 0;
  const mx = active ? (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0) : 0;

  wish.set(0, 0, 0)
      .addScaledVector(forward, mz)
      .addScaledVector(right, mx);
  if (wish.lengthSq() > 0) wish.normalize();

  const running = active && (keys['ShiftLeft'] || keys['ShiftRight']);
  const targetSpeed = running ? RUN_SPEED : WALK_SPEED;

  const accel = player.grounded ? 13 : 3;
  player.vel.x = THREE.MathUtils.damp(player.vel.x, wish.x * targetSpeed, accel, delta);
  player.vel.z = THREE.MathUtils.damp(player.vel.z, wish.z * targetSpeed, accel, delta);

  player.pos.x += player.vel.x * delta;
  player.pos.z += player.vel.z * delta;

  player.vel.y -= GRAVITY * delta;
  player.pos.y += player.vel.y * delta;

  if (player.pos.y <= EYE_HEIGHT) {
    player.pos.y = EYE_HEIGHT;
    player.vel.y = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  if (active && keys['Space'] && player.grounded) {
    player.vel.y = JUMP_SPEED;
    player.grounded = false;
  }

  const hSpeed = Math.hypot(player.vel.x, player.vel.z);
  const wantBob = (player.grounded && hSpeed > 0.35) ? 1 : 0;
  player.bobBlend = THREE.MathUtils.damp(player.bobBlend, wantBob, 6, delta);
  player.bobPhase += delta * (4.4 + hSpeed * 0.85);

  const bobY = Math.sin(player.bobPhase * 2) * 0.032 * player.bobBlend;
  const sway = Math.cos(player.bobPhase)     * 0.022 * player.bobBlend;

  camera.position.copy(player.pos);
  camera.position.x += right.x * sway;
  camera.position.z += right.z * sway;
  camera.position.y += bobY;

  const targetFov = 72 + (running && hSpeed > 4.2 ? 5.0 : 0.0);
  if (Math.abs(camera.fov - targetFov) > 0.02) {
    camera.fov = THREE.MathUtils.damp(camera.fov, targetFov, 5, delta);
    camera.updateProjectionMatrix();
  }
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nyxara — The First Islet</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0b001a;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; user-select:none; }
  canvas { display:block; position:absolute; inset:0; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }

  #top {
    position:fixed; top:0; left:0; right:0; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; z-index:10;
  }
  #island-name {
    font-size:24px; font-weight:900; letter-spacing:1px; color:#fff;
    text-shadow:0 0 20px rgba(180,100,255,.8), 0 2px 0 rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.4);
    background:rgba(30,10,50,.6); padding:10px 22px; border-radius:999px;
    backdrop-filter:blur(10px); border:1px solid rgba(200,150,255,.3);
  }
  #island-name small {
    display:block; font-size:11px; font-weight:700; letter-spacing:3px;
    color:#b89aff; text-transform:uppercase; margin-top:3px;
  }
  #hint {
    font-size:12px; color:rgba(220,200,255,.8); font-weight:600;
    background:rgba(10,0,25,.5); padding:8px 16px; border-radius:999px;
    backdrop-filter:blur(8px); border:1px solid rgba(180,120,255,.2);
    text-align:right; line-height:1.6;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top">
  <div id="island-name">🌌 Nyxara<small>The First Islet</small></div>
  <div id="hint">Drag to pan • Scroll to zoom</div>
</div>

<script>
/* =========================================================================
   NYXARA — Cosmic Islet Prototype
   All geometry is drawn procedurally on a single canvas.
   ========================================================================= */

/* ------------------------------ CANVAS ------------------------------ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let DPR = 1, W = 0, H = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------ STATE ------------------------------ */
const state = { cam: { x: 0, y: 0, zoom: 1 } };

/* --------------------------- HELPERS --------------------------- */
function dot(x, y, r) {
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, Math.PI * 2);
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================== DRAWING ============================== */

/* --------------------------- SPACE BACKDROP --------------------------- */
const stars = (() => {
  const rnd = mulberry32(42);
  const out = [];
  for (let i = 0; i < 400; i++) {
    out.push({
      x: rnd() * 2000 - 500,
      y: rnd() * 2000 - 500,
      r: 0.5 + rnd() * 2.2,
      a: 0.3 + rnd() * 0.7,
      tw: rnd() * Math.PI * 2,
      spd: 0.5 + rnd() * 2,
      col: rnd() > 0.8 ? '#aaddff' : (rnd() > 0.6 ? '#ffccff' : '#ffffff'),
    });
  }
  return out;
})();

const nebulae = [
  { x: 0.15, y: 0.25, r: 450, c1: 'rgba(255,0,150,0.12)', c2: 'rgba(255,0,150,0)' },
  { x: 0.85, y: 0.35, r: 520, c1: 'rgba(0,200,255,0.10)', c2: 'rgba(0,200,255,0)' },
  { x: 0.50, y: 0.75, r: 600, c1: 'rgba(150,0,255,0.10)', c2: 'rgba(150,0,255,0)' },
  { x: 0.25, y: 0.80, r: 400, c1: 'rgba(0,255,200,0.08)', c2: 'rgba(0,255,200,0)' },
];

function drawSky(t) {
  // Deep space gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.0, '#05000a');
  g.addColorStop(0.3, '#0f0025');
  g.addColorStop(0.7, '#1a0035');
  g.addColorStop(1.0, '#0d001a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Nebulae
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const n of nebulae) {
    const nx = n.x * W + Math.sin(t * 0.05 + n.x * 10) * 20;
    const ny = n.y * H + Math.cos(t * 0.04 + n.y * 10) * 20;
    const rg = ctx.createRadialGradient(nx, ny, 10, nx, ny, n.r);
    rg.addColorStop(0, n.c1);
    rg.addColorStop(1, n.c2);
    ctx.fillStyle = rg;
    ctx.fillRect(nx - n.r, ny - n.r, n.r * 2, n.r * 2);
  }
  ctx.restore();

  // Stars
  for (const s of stars) {
    const alpha = s.a * (0.6 + 0.4 * Math.sin(t * s.spd + s.tw));
    const sx = (s.x + W / 2) % (W + 1000) - 500;
    const sy = (s.y + H / 2) % (H + 1000) - 500;
    ctx.fillStyle = s.col;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ======================= ISLAND GEOMETRY ======================= */
const RX  = 520;    // outer crystal rim horizontal radius
const RY  = 260;    // outer crystal rim vertical radius
const GRX = 440;    // void surface horizontal radius
const GRY = 200;    // void surface vertical radius
const BOT = 420;    // bottom of the islet

/* ----------------------------- CRYSTAL SPIKES ----------------------------- */
function drawCrystalSpike(x, y, angle, size, hue, alpha = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  // The spike is a sharp triangle extending outwards
  const len = size * 2.5;
  const wid = size * 0.8;

  // Glow
  ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${alpha * 0.8})`;
  ctx.shadowBlur = 20;

  // Main body
  const grad = ctx.createLinearGradient(0, 0, len, 0);
  grad.addColorStop(0, `hsla(${hue}, 90%, 50%, ${alpha})`);
  grad.addColorStop(0.5, `hsla(${hue + 30}, 90%, 65%, ${alpha})`);
  grad.addColorStop(1, `hsla(${hue + 60}, 90%, 80%, ${alpha})`);

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, -wid);
  ctx.lineTo(len, 0);
  ctx.lineTo(0, wid);
  ctx.closePath();
  ctx.fill();

  // Inner highlight
  ctx.shadowBlur = 0;
  ctx.fillStyle = `hsla(${hue + 60}, 100%, 90%, ${alpha * 0.5})`;
  ctx.beginPath();
  ctx.moveTo(0, -wid * 0.4);
  ctx.lineTo(len * 0.8, 0);
  ctx.lineTo(0, 0);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

/* ----------------------------- ISLAND BASE ----------------------------- */
function drawIslandBase(t) {
  ctx.save();

  // Main teal/cyan base
  const baseGrad = ctx.createLinearGradient(0, 0, 0, BOT + 50);
  baseGrad.addColorStop(0.0, '#006688');
  baseGrad.addColorStop(0.4, '#0099bb');
  baseGrad.addColorStop(0.8, '#00ccff');
  baseGrad.addColorStop(1.0, '#00e5ff');

  ctx.fillStyle = baseGrad;
  ctx.beginPath();
  ctx.moveTo(-RX, 0);
  // Organic, wavy left side
  ctx.bezierCurveTo(-RX - 40, 120, -RX + 60, 250, -200, BOT - 40);
  ctx.bezierCurveTo(-100, BOT + 10, 100, BOT + 10, 200, BOT - 40);
  // Organic, wavy right side
  ctx.bezierCurveTo(RX - 60, 250, RX + 40, 120, RX, 0);
  ctx.closePath();
  ctx.fill();

  // Darker under-shadow
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#003344';
  ctx.beginPath();
  ctx.moveTo(-RX + 50, 0);
  ctx.bezierCurveTo(-RX + 10, 120, -RX + 100, 240, -160, BOT - 10);
  ctx.bezierCurveTo(-80, BOT + 20, 80, BOT + 20, 160, BOT - 10);
  ctx.bezierCurveTo(RX - 100, 240, RX - 10, 120, RX - 50, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Glowing veins / cracks on the base
  ctx.save();
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 15;
  ctx.strokeStyle = '#00ffff';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';

  const veins = [
    { x1: -300, y1: 150, cx: -200, cy: 220, x2: -150, y2: 300 },
    { x1: 280, y1: 120, cx: 220, cy: 200, x2: 180, y2: 280 },
    { x1: -100, y1: 280, cx: 0, cy: 320, x2: 120, y2: 290 },
    { x1: -420, y1: 100, cx: -380, cy: 160, x2: -350, y2: 200 },
    { x1: 400, y1: 90, cx: 360, cy: 150, x2: 340, y2: 220 },
  ];

  for (const v of veins) {
    ctx.beginPath();
    ctx.moveTo(v.x1, v.y1);
    ctx.quadraticCurveTo(v.cx, v.cy, v.x2, v.y2);
    ctx.stroke();
  }
  ctx.restore();

  // Glowing pools (the blue rounded squares from the reference)
  ctx.save();
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 25;

  const pools = [
    { x: -200, y: 260, w: 80, h: 50 },
    { x: 200, y: 260, w: 80, h: 50 },
    { x: 0, y: 300, w: 60, h: 40 },
    { x: -320, y: 160, w: 50, h: 30 },
    { x: 320, y: 160, w: 50, h: 30 },
  ];

  for (const p of pools) {
    const pg = ctx.createRadialGradient(p.x, p.y, 5, p.x, p.y, p.w);
    pg.addColorStop(0, 'rgba(180,255,255,0.9)');
    pg.addColorStop(0.5, 'rgba(0,200,255,0.6)');
    pg.addColorStop(1, 'rgba(0,100,150,0)');
    ctx.fillStyle = pg;
    roundRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h, 15);
    ctx.fill();
  }
  ctx.restore();

  ctx.restore();
}

/* ----------------------------- CRYSTAL RIM ----------------------------- */
function drawCrystalRim(t) {
  const BUMPS = 72;

  for (let i = 0; i < BUMPS; i++) {
    const a = (i / BUMPS) * Math.PI * 2 - Math.PI / 2; // Start from top
    const bx = Math.cos(a) * RX;
    const by = Math.sin(a) * RY;

    // Size varies, larger at the sides and bottom
    const sizeMod = 0.5 + 0.5 * Math.abs(Math.sin(a));
    const size = (18 + Math.sin(i * 1.7) * 8 + Math.cos(i * 0.9) * 5) * sizeMod;

    // Angle points outwards
    const angle = a;

    // Hue shifts from pink/purple at the top to blue/cyan at the bottom
    const hue = 280 + 60 * Math.sin(a - Math.PI / 2); // 280 (purple) to 340 (pink) to 220 (blue)

    // Draw main spike
    drawCrystalSpike(bx, by, angle, size, hue, 0.9);

    // Draw a smaller secondary spike next to it
    if (i % 2 === 0) {
      drawCrystalSpike(bx * 1.05, by * 1.05, angle + 0.2, size * 0.5, hue + 20, 0.7);
    }
  }
}

/* ----------------------------- VOID SURFACE ----------------------------- */
function drawVoidSurface(t) {
  // The deep, dark top surface
  ctx.save();

  // Base dark void
  const voidGrad = ctx.createRadialGradient(-50, -50, 20, 0, 0, GRX);
  voidGrad.addColorStop(0, '#1a0033');
  voidGrad.addColorStop(0.6, '#0d001a');
  voidGrad.addColorStop(1, '#05000a');

  ctx.fillStyle = voidGrad;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX, GRY, 0, 0, Math.PI * 2);
  ctx.fill();

  // Inner glowing rim
  ctx.shadowColor = '#b44aff';
  ctx.shadowBlur = 30;
  ctx.strokeStyle = 'rgba(180, 100, 255, 0.6)';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX - 4, GRY - 4, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255, 150, 255, 0.4)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX - 12, GRY - 12, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Subtle surface swirls (void energy)
  ctx.globalAlpha = 0.08;
  ctx.strokeStyle = '#cc88ff';
  ctx.lineWidth = 15;
  for (let i = 0; i < 5; i++) {
    const off = Math.sin(t * 0.3 + i) * 20;
    ctx.beginPath();
    ctx.ellipse(off, -10 + off * 0.5, GRX * 0.7, GRY * 0.7, t * 0.1 + i, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Floating rocks / crystals on the void surface
  const rnd = mulberry32(777);
  for (let i = 0; i < 12; i++) {
    const a = rnd() * Math.PI * 2;
    const r = Math.sqrt(rnd()) * 0.8;
    const px = Math.cos(a) * r * GRX;
    const py = Math.sin(a) * r * GRY - 10;

    const bob = Math.sin(t * 1.5 + i) * 5;

    ctx.save();
    ctx.translate(px, py + bob);
    ctx.rotate(rnd() * Math.PI);

    // Crystal shard
    ctx.fillStyle = `rgba(180, 100, 255, ${0.4 + rnd() * 0.4})`;
    ctx.shadowColor = '#b44aff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(10, 0);
    ctx.lineTo(0, 15);
    ctx.lineTo(-10, 0);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  ctx.restore();
}

/* ----------------------------- FLOATING DEBRIS ----------------------------- */
const debris = (() => {
  const rnd = mulberry32(1234);
  const out = [];
  for (let i = 0; i < 40; i++) {
    const a = rnd() * Math.PI * 2;
    const r = 1.1 + rnd() * 0.8; // Orbit radius
    out.push({
      a,
      r,
      size: 2 + rnd() * 6,
      spd: 0.1 + rnd() * 0.3,
      yOff: (rnd() - 0.5) * 400,
      hue: 260 + rnd() * 80,
      phase: rnd() * Math.PI * 2,
    });
  }
  return out;
})();

function drawDebris(t) {
  ctx.save();
  ctx.translate(W / 2 + state.cam.x, H * 0.45 + state.cam.y);

  for (const d of debris) {
    const angle = d.a + t * d.spd * 0.2;
    const dx = Math.cos(angle) * RX * d.r;
    const dy = Math.sin(angle) * RY * d.r + d.yOff + Math.sin(t * 0.5 + d.phase) * 20;

    // Only draw if it's "in front" (not behind the island)
    // We approximate by checking if it's below the island center
    if (dy < 0 && dx > -RX && dx < RX) continue;

    ctx.save();
    ctx.translate(dx, dy);
    ctx.rotate(angle * 2);

    const alpha = 0.4 + 0.3 * Math.sin(t * 2 + d.phase);
    ctx.fillStyle = `hsla(${d.hue}, 80%, 70%, ${alpha})`;
    ctx.shadowColor = `hsla(${d.hue}, 100%, 60%, 0.8)`;
    ctx.shadowBlur = 12;

    ctx.beginPath();
    if (d.size > 4) {
      // Crystal shape
      ctx.moveTo(0, -d.size);
      ctx.lineTo(d.size * 0.6, 0);
      ctx.lineTo(0, d.size);
      ctx.lineTo(-d.size * 0.6, 0);
      ctx.closePath();
    } else {
      // Small rock
      ctx.arc(0, 0, d.size, 0, Math.PI * 2);
    }
    ctx.fill();

    ctx.restore();
  }

  ctx.restore();
}

/* ----------------------------- MAIN ISLAND DRAW ----------------------------- */
function drawIsland(t) {
  ctx.save();
  ctx.translate(W / 2 + state.cam.x, H * 0.45 + state.cam.y);

  // Drop shadow
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, BOT + 60, 350, 70, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Draw layers
  drawIslandBase(t);
  drawCrystalRim(t);
  drawVoidSurface(t);

  // Final rim highlight
  ctx.save();
  ctx.shadowColor = '#ff66ff';
  ctx.shadowBlur = 15;
  ctx.strokeStyle = 'rgba(255, 150, 255, 0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, -10, GRX, GRY, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  ctx.restore();
}

/* ------------------------------ VIGNETTE ------------------------------ */
function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3,
                                     W / 2, H / 2, Math.max(W, H) * 0.8);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(5,0,15,0.6)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ============================== LOOP ============================== */
function render(now) {
  const t = now / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  drawSky(t);
  drawIsland(t);
  drawDebris(t);
  drawVignette();

  requestAnimationFrame(render);
}

/* ============================ INTERACTION ============================ */
let isDragging = false, lastX = 0, lastY = 0;

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  isDragging = true;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  state.cam.x += e.clientX - lastX;
  state.cam.y += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('pointerup',    () => { isDragging = false; });
canvas.addEventListener('pointercancel',() => { isDragging = false; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const z  = state.cam.zoom;
  const nz = Math.min(3.0, Math.max(0.35, z * (e.deltaY > 0 ? 0.9 : 1.1)));

  const wx = (e.clientX - W / 2 - state.cam.x) / z;
  const wy = (e.clientY - H * 0.45 - state.cam.y) / z;
  state.cam.x = e.clientX - W / 2 - wx * nz;
  state.cam.y = e.clientY - H * 0.45 - wy * nz;
  state.cam.zoom = nz;
}, { passive: false });

/* ------------------------- INITIAL CAMERA FIT ------------------------- */
function fitCamera() {
  const zoomX = (W * 0.92) / 1100;
  const zoomY = (H * 0.88) / 800;
  state.cam.zoom = Math.max(0.4, Math.min(1.3, Math.min(zoomX, zoomY)));
  state.cam.x = 0;
  state.cam.y = 0;
}
fitCamera();

/* ------------------------------ GO! ------------------------------ */
requestAnimationFrame(render);
</script>
</body>
</html>
